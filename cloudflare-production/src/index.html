<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="ciao-build" content="ciao-web-cloudflare-entry-v1">
  <meta name="theme-color" content="#091BBD">
  <title>Ciao, Web!</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#071128;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    b{font-size:19px}span{display:block;margin-top:8px;color:#96a6b5;font-size:12px}
  </style>
</head>
<body>
  <div><b>Ciao, Web!</b><span>Открываем приложение…</span></div>
  <script>
    (()=>{
      const incoming = new URL(location.href);
      const target = new URL('/releases/v22-5.html', location.origin);
      for (const [key,value] of incoming.searchParams) target.searchParams.append(key,value);
      if (incoming.hash) target.hash = incoming.hash;
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
