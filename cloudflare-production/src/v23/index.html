<script>
(function(){
  function postEvent(eventType,eventData){
    if(eventData===undefined) eventData='';
    try{
      if(window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent==='function'){
        window.TelegramWebviewProxy.postEvent(eventType,JSON.stringify(eventData));
        return true;
      }
    }catch(e){}
    try{
      if(window.external && typeof window.external.notify==='function'){
        window.external.notify(JSON.stringify({eventType:eventType,eventData:eventData}));
        return true;
      }
    }catch(e){}
    try{
      if(window.parent && window.parent!==window){
        window.parent.postMessage(JSON.stringify({eventType:eventType,eventData:eventData}),'*');
        return true;
      }
    }catch(e){}
    return false;
  }

  function params(){
    var out={};
    try{
      [location.hash.replace(/^#/,''),location.search.replace(/^\?/, '')].forEach(function(raw){
        var p=new URLSearchParams(raw);
        p.forEach(function(v,k){ if(out[k]===undefined) out[k]=v; });
      });
    }catch(e){}
    return out;
  }
  var p=params();
  window.Telegram=window.Telegram||{};
  var existing=window.Telegram.WebApp||{};
  var shim={
    initData: existing.initData || p.tgWebAppData || '',
    version: existing.version || p.tgWebAppVersion || '',
    platform: existing.platform || p.tgWebAppPlatform || '',
    ready:function(){ postEvent('web_app_ready'); },
    expand:function(){ postEvent('web_app_expand'); },
    disableVerticalSwipes:function(){ postEvent('web_app_setup_swipe_behavior',{allow_vertical_swipe:false}); },
    setHeaderColor:function(){},
    setBackgroundColor:function(){},
    onEvent:function(){},
    HapticFeedback:{notificationOccurred:function(){}},
    showAlert:function(msg){ try{alert(msg);}catch(e){} },
    get viewportHeight(){ return window.innerHeight; },
    get viewportStableHeight(){ return window.innerHeight; }
  };
  window.Telegram.WebApp=Object.assign(shim,existing);
  window.__ciaoNativePost=postEvent;

  // Official SDK semantics: web_app_ready has an empty-string payload.
  postEvent('web_app_ready');
  postEvent('web_app_expand');
  try{ window.Telegram.WebApp.disableVerticalSwipes(); }catch(e){}
})();
</script>

#ciao-miniapp-root .mc-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 15px 12px}
#ciao-miniapp-root .mc-section-title{font-family:'Unbounded','Manrope',sans-serif;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#dce3ff}
#ciao-miniapp-root .mc-section-note{font-size:9px;color:#6f7da9}
#ciao-miniapp-root .mc-key-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(143,162,227,.08);border-top:1px solid rgba(143,162,227,.08)}
#ciao-miniapp-root .mc-key{background:#0b132e;padding:13px 8px;text-align:center}
#ciao-miniapp-root .mc-key b{display:block;font-family:'Unbounded','Manrope',sans-serif;font-size:17px;font-weight:600;color:#fff}
#ciao-miniapp-root .mc-key span{display:block;margin-top:5px;font-size:9px;color:#7482b5;text-transform:uppercase;letter-spacing:.045em}
#ciao-miniapp-root .mc-stats{padding:3px 15px 12px}
#ciao-miniapp-root .mc-stat-row{padding:10px 0;border-bottom:1px solid rgba(143,162,227,.075)}
#ciao-miniapp-root .mc-stat-row:last-child{border-bottom:0}
#ciao-miniapp-root .mc-stat-values{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
#ciao-miniapp-root .mc-stat-v{font-family:'Unbounded','Manrope',sans-serif;font-size:11px;font-weight:600;color:#f4f6ff}
#ciao-miniapp-root .mc-stat-v.away{text-align:right}
#ciao-miniapp-root .mc-stat-label{text-align:center;font-size:10px;color:#8997c5}
#ciao-miniapp-root .mc-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:7px;height:3px}
#ciao-miniapp-root .mc-bar{position:relative;background:rgba(255,255,255,.05);overflow:hidden}
#ciao-miniapp-root .mc-bar:first-child{border-radius:4px 0 0 4px}
#ciao-miniapp-root .mc-bar:last-child{border-radius:0 4px 4px 0}
#ciao-miniapp-root .mc-bar i{position:absolute;top:0;bottom:0;background:#3150ff;transition:width .35s ease}
#ciao-miniapp-root .mc-bar.home i{right:0}
#ciao-miniapp-root .mc-bar.away i{left:0;background:#a8b3dc}
#ciao-miniapp-root .mc-chart-pad{padding:0 15px 15px}
#ciao-miniapp-root .mc-momentum{height:96px;display:flex;align-items:center;gap:1px;position:relative;padding:7px 0}
#ciao-miniapp-root .mc-momentum::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(143,162,227,.12)}
#ciao-miniapp-root .mc-momentum-bar{flex:1;height:100%;position:relative;min-width:1px}
#ciao-miniapp-root .mc-momentum-bar i{position:absolute;left:0;right:0;max-height:45%;min-height:2px;border-radius:2px;background:#3150ff;opacity:.88;transition:height .3s ease}
#ciao-miniapp-root .mc-momentum-bar.home i{bottom:50%}
#ciao-miniapp-root .mc-momentum-bar.away i{top:50%;background:#9ba7d2;opacity:.68}
#ciao-miniapp-root .mc-pitch{position:relative;aspect-ratio:1.56;border:1px solid rgba(146,170,255,.18);border-radius:16px;background:linear-gradient(180deg,rgba(9,27,189,.10),rgba(255,255,255,.015));overflow:hidden}
#ciao-miniapp-root .mc-pitch::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(180,193,239,.15)}
#ciao-miniapp-root .mc-pitch::after{content:'';position:absolute;left:50%;top:50%;width:54px;height:54px;border:1px solid rgba(180,193,239,.15);border-radius:50%;transform:translate(-50%,-50%)}
#ciao-miniapp-root .mc-penalty{position:absolute;top:21%;bottom:21%;width:13%;border:1px solid rgba(180,193,239,.13)}
#ciao-miniapp-root .mc-penalty.left{left:-1px;border-left:0}.mc-penalty.right{right:-1px;border-right:0}
#ciao-miniapp-root .mc-shot{position:absolute;width:8px;height:8px;border-radius:50%;background:#3150ff;border:1px solid rgba(255,255,255,.8);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#ciao-miniapp-root .mc-shot.away{background:#aeb8dc}.mc-shot.goal{width:10px;height:10px;background:#f1c967;box-shadow:0 0 0 4px rgba(241,201,103,.12),0 2px 8px rgba(0,0,0,.35)}
#ciao-miniapp-root .mc-timeline{padding:2px 15px 13px}
#ciao-miniapp-root .mc-event{display:grid;grid-template-columns:44px 23px 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(143,162,227,.075)}
#ciao-miniapp-root .mc-event:last-child{border-bottom:0}
#ciao-miniapp-root .mc-event-minute{font-family:'Unbounded','Manrope',sans-serif;font-size:9px;color:#8f9bc4;text-align:right}
#ciao-miniapp-root .mc-event-icon{width:23px;height:23px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.045);font-size:11px}
#ciao-miniapp-root .mc-event-text{font-size:11px;line-height:1.35;color:#d5dcf5;min-width:0}
#ciao-miniapp-root .mc-event-text small{display:block;color:#6f7da9;font-size:9px;margin-top:2px}
#ciao-miniapp-root .mc-lineups{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(143,162,227,.08);border-top:1px solid rgba(143,162,227,.08)}
#ciao-miniapp-root .mc-lineup{background:#0a122b;padding:13px 12px}
#ciao-miniapp-root .mc-lineup-title{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:10px;font-weight:800;margin-bottom:9px}.mc-lineup-title span{color:#7280af;font-size:9px;font-weight:600}
#ciao-miniapp-root .mc-player{display:flex;align-items:center;gap:7px;font-size:10px;padding:6px 0;border-bottom:1px solid rgba(143,162,227,.06)}
#ciao-miniapp-root .mc-player:last-child{border-bottom:0}
#ciao-miniapp-root .mc-shirt{width:22px;height:22px;border-radius:7px;background:rgba(49,80,255,.12);display:grid;place-items:center;font-family:'Unbounded','Manrope',sans-serif;font-size:8px;color:#b8c5ff;flex:0 0 auto}
#ciao-miniapp-root .mc-player-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ciao-miniapp-root .mc-player-list{padding:2px 15px 14px}
#ciao-miniapp-root .mc-rating-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(143,162,227,.075)}
#ciao-miniapp-root .mc-rating-row:last-child{border-bottom:0}
#ciao-miniapp-root .mc-rating-name{font-size:11px;font-weight:800}.mc-rating-meta{font-size:9px;color:#7482ae;margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
#ciao-miniapp-root .mc-rating{font-family:'Unbounded','Manrope',sans-serif;font-size:11px;font-weight:700;padding:7px 8px;border-radius:9px;background:rgba(49,80,255,.11);color:#cbd5ff;min-width:42px;text-align:center}
#ciao-miniapp-root .mc-extra{padding:0 15px 13px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
#ciao-miniapp-root .mc-extra-item{background:rgba(255,255,255,.025);border:1px solid rgba(143,162,227,.075);border-radius:12px;padding:9px 10px}
#ciao-miniapp-root .mc-extra-item span{display:block;color:#6f7da9;font-size:8px;text-transform:uppercase;letter-spacing:.04em}.mc-extra-item b{display:block;margin-top:4px;font-size:11px;color:#e6ebff}
#ciao-miniapp-root .mc-empty{padding:18px 15px;color:#6f7da9;font-size:11px;text-align:center}
#ciao-miniapp-root.match-center-open .nav{transform:translateY(110%);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.2,.7,.2,1),opacity .2s ease}
#ciao-miniapp-root.match-center-open .content{padding-bottom:calc(var(--ciao-safe-bottom) + 18px)!important}
#ciao-miniapp-root.match-center-open .savebar{display:none!important}
#ciao-miniapp-root .mc-live-patch *{animation:none!important}
@keyframes mcPulse{0%,100%{opacity:.62;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes mcScore{0%{transform:scale(1);text-shadow:none}40%{transform:scale(1.08);text-shadow:0 0 22px rgba(49,80,255,.58)}100%{transform:scale(1);text-shadow:none}}
@media(max-width:390px){#ciao-miniapp-root .mc-team .logo{width:50px!important;height:50px!important;flex-basis:50px!important}.mc-team-name{font-size:12px!important}#ciao-miniapp-root .mc-score{font-size:27px}.mc-center{min-width:88px!important}#ciao-miniapp-root .mc-stat-values{grid-template-columns:45px 1fr 45px}.mc-lineups{grid-template-columns:1fr!important}}
</style>

#ciao-miniapp-root .stat{border-radius:18px!important;padding:15px!important;}
#ciao-miniapp-root .stat b{font-size:24px!important;font-weight:900!important;}
#ciao-miniapp-root .stat span{font-size:12px!important;color:var(--muted)!important;}
#ciao-miniapp-root .nav{
  min-height:80px!important;padding:10px 10px calc(10px + var(--ciao-safe-bottom))!important;
  background:linear-gradient(180deg, rgba(5,11,36,.78), rgba(5,11,36,.97))!important;
  backdrop-filter:blur(24px)!important;
  border-top:1px solid rgba(125,153,255,.14)!important;
}
#ciao-miniapp-root .nav-inner{gap:8px!important;}
#ciao-miniapp-root .nav button{
  min-height:56px!important;
  padding:8px 4px!important;
  border-radius:16px!important;
  color:#9fb0e2!important;
  display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;
  transition:all .18s ease;
}
#ciao-miniapp-root .nav button b{font-size:18px!important;line-height:1!important;margin:0!important;}
#ciao-miniapp-root .nav .nav-label{font-size:11px!important;line-height:1.08!important;font-weight:800!important;letter-spacing:-.01em;display:block;white-space:normal;text-align:center;}
#ciao-miniapp-root .nav button.active{
  color:#fff!important;
  background:linear-gradient(135deg, rgba(53,88,255,.22), rgba(9,27,189,.42))!important;
  box-shadow:inset 0 0 0 1px rgba(125,153,255,.18),0 10px 22px rgba(9,27,189,.18)!important;
}
#ciao-miniapp-root .toast{bottom:calc(var(--ciao-nav-h) + var(--ciao-safe-bottom) + 20px)!important;border-radius:14px!important;}
#ciao-miniapp-root .loader{
  min-height:58vh!important;display:grid!important;place-items:center!important;text-align:center!important;padding:20px 12px!important;color:var(--text)!important;
}
#ciao-miniapp-root .loader-box{display:flex;flex-direction:column;align-items:center;gap:14px;}
#ciao-miniapp-root .loader-mark{position:relative;width:min(46vw,190px);aspect-ratio:1 / 1;display:grid;place-items:center;}

#ciao-miniapp-root .loader-mark::after{
  content:'';position:absolute;inset:18%;border-radius:999px;filter:blur(28px);z-index:0;
  background:radial-gradient(circle, rgba(53,88,255,.55), rgba(53,88,255,0) 70%);animation:ciaoGlow 2.2s ease-in-out infinite;
}
#ciao-miniapp-root .loader-outline{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;opacity:.22;mix-blend-mode:screen;}
#ciao-miniapp-root .loader-title{font-size:24px;font-weight:900;letter-spacing:-.04em;}
#ciao-miniapp-root .loader-sub{font-size:13px;color:var(--muted);max-width:240px;line-height:1.4;}
#ciao-miniapp-root .loader-line{width:120px;height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}
#ciao-miniapp-root .loader-line::before{content:'';position:absolute;left:-35%;top:0;bottom:0;width:35%;border-radius:inherit;background:linear-gradient(90deg, rgba(53,88,255,0), rgba(111,136,255,.95), rgba(53,88,255,0));animation:ciaoSlide 1.4s ease-in-out infinite;}
#ciao-miniapp-root .live-row{
  margin-top:11px!important;padding:10px 12px!important;border-radius:14px!important;
  background:linear-gradient(135deg, rgba(255,85,119,.12), rgba(255,85,119,.06))!important;border:1px solid rgba(255,85,119,.22)!important;
}
#ciao-miniapp-root .live-pill{color:#ff7d96!important;font-size:11px!important;}
#ciao-miniapp-root .live-dot{width:8px!important;height:8px!important;background:#ff5577!important;}
#ciao-miniapp-root .live-score{font-size:19px!important;}
#ciao-miniapp-root .empty{padding:34px 18px!important;font-size:14px;}
#ciao-miniapp-root .match,#ciao-miniapp-root .card,#ciao-miniapp-root .hero,#ciao-miniapp-root .stat{animation:ciaoFadeUp .28s ease both;}
@keyframes ciaoFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes ciaoLoaderFill{0%{background-position:50% 100%}100%{background-position:50% 0%}}
@keyframes ciaoGlow{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.05);opacity:.9}}
@keyframes ciaoSlide{0%{left:-35%}100%{left:100%}}
@media (max-width:420px){
  #ciao-miniapp-root .brand-logo{width:52px;height:52px;}
  #ciao-miniapp-root .brand h1{font-size:24px!important;}
  #ciao-miniapp-root .team-name,#ciao-miniapp-root .cal-match{font-size:14px!important;}
  #ciao-miniapp-root .score-side{grid-template-columns:40px 1fr 40px!important;}
  #ciao-miniapp-root .nav{min-height:84px!important;}
  #ciao-miniapp-root .nav .nav-label{font-size:10.5px!important;}
}
</style>


<style id="ciao-premium-v4">
/* Premium Match Center v3 */
#ciao-miniapp-root .mine-card{padding:4px 14px!important;overflow:hidden}
#ciao-miniapp-root .mine-match{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--line);position:relative;
}
#ciao-miniapp-root .mine-match:last-child{border-bottom:0}
#ciao-miniapp-root .mine-main{min-width:0}
#ciao-miniapp-root .mine-pair{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);align-items:center;gap:8px}
#ciao-miniapp-root .mine-team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:13px}
#ciao-miniapp-root .mine-team.away{justify-content:flex-end;text-align:right}
#ciao-miniapp-root .mine-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ciao-miniapp-root .mine-team .logo{width:25px!important;height:25px!important;flex-basis:25px!important}
#ciao-miniapp-root .mine-dash{text-align:center;color:rgba(190,203,240,.55);font-weight:700}
#ciao-miniapp-root .mine-meta{display:flex;align-items:center;gap:7px;min-height:17px;margin-top:6px;color:var(--muted);font-size:10.5px;font-weight:700}
#ciao-miniapp-root .mine-live{color:#ff6c88;font-weight:900;letter-spacing:.02em}
#ciao-miniapp-root .mine-prediction{
  min-width:66px;padding:8px 10px;border-radius:13px;text-align:center;
  background:rgba(255,255,255,.045);border:1px solid rgba(150,169,235,.12);
  color:#fff;font-size:13px;font-weight:900;white-space:nowrap;
}
#ciao-miniapp-root .mine-prediction.has-points{border-color:rgba(9,27,189,.35);background:rgba(9,27,189,.13)}

#ciao-miniapp-root .scoreboards{display:grid;gap:12px;padding-bottom:6px}
#ciao-miniapp-root .scoreboard-card{
  position:relative;overflow:hidden;border-radius:24px;padding:14px 14px 15px;
  background:
    radial-gradient(circle at 50% -20%, rgba(49,80,255,.20), transparent 48%),
    linear-gradient(180deg,rgba(13,23,58,.98),rgba(7,14,38,.98));
  border:1px solid rgba(138,159,230,.15);box-shadow:0 18px 46px rgba(0,0,0,.25);
}
#ciao-miniapp-root .scoreboard-card::after{
  content:'';position:absolute;inset:auto 14% -1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(74,101,255,.55),transparent);opacity:.75
}
#ciao-miniapp-root .scoreboard-card.live{
  border-color:rgba(255,82,116,.24);
  background:
    radial-gradient(circle at 50% -20%, rgba(255,82,116,.10), transparent 42%),
    radial-gradient(circle at 50% 12%, rgba(9,27,189,.18), transparent 55%),
    linear-gradient(180deg,rgba(13,23,58,.99),rgba(7,14,38,.99));
}
#ciao-miniapp-root .scoreboard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
#ciao-miniapp-root .board-status{
  min-height:25px;display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid rgba(150,169,235,.11);
  color:#b8c5eb;font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap
}
#ciao-miniapp-root .scoreboard-card.live .board-status{color:#ff8198;background:rgba(255,82,116,.09);border-color:rgba(255,82,116,.18)}
#ciao-miniapp-root .scoreboard-card.live .board-status::before{
  content:'';width:7px;height:7px;border-radius:50%;background:#ff526f;box-shadow:0 0 0 0 rgba(255,82,111,.4);animation:boardPulse 1.55s infinite
}
#ciao-miniapp-root .scoreboard-card.finished .board-status{color:#9fb2ff;background:rgba(9,27,189,.12);border-color:rgba(85,112,255,.18)}
#ciao-miniapp-root .board-kickoff{color:var(--muted);font-size:10.5px;font-weight:700;white-space:nowrap}
#ciao-miniapp-root .scoreboard-main{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(92px,auto) minmax(0,1fr);align-items:center;gap:8px
}
#ciao-miniapp-root .board-team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
#ciao-miniapp-root .board-team .logo{width:45px!important;height:45px!important;flex-basis:45px!important;filter:drop-shadow(0 10px 20px rgba(0,0,0,.28))}
#ciao-miniapp-root .board-team-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;letter-spacing:-.02em;color:#f6f8ff}
#ciao-miniapp-root .board-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
#ciao-miniapp-root .board-score{
  min-width:92px;text-align:center;font-family:'Unbounded','Manrope',sans-serif!important;
  font-size:28px;line-height:1;font-weight:700;letter-spacing:-.055em;color:#fff;
  text-shadow:0 8px 22px rgba(9,27,189,.18);font-variant-numeric:tabular-nums;
  transition:transform .22s cubic-bezier(.2,.75,.25,1),color .2s ease,text-shadow .2s ease
}
#ciao-miniapp-root .board-score.waiting{font-size:23px;color:#7888b8;letter-spacing:-.02em}
#ciao-miniapp-root .board-score.score-flash{transform:scale(1.08);color:#a9b8ff;text-shadow:0 0 22px rgba(49,80,255,.5)}
#ciao-miniapp-root .board-caption{min-height:14px;margin-top:7px;color:#7181ad;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center}
#ciao-miniapp-root .scoreboard-card.live .board-caption{color:#ff8198}
#ciao-miniapp-root .scoreboard-card.finished .board-caption{color:#91a7ff}

/* Live updates only mutate text nodes — no entrance animation on refresh. */
#ciao-miniapp-root.live-patching .match,
#ciao-miniapp-root.live-patching .card,
#ciao-miniapp-root.live-patching .hero,
#ciao-miniapp-root.live-patching .stat,
#ciao-miniapp-root.live-patching .scoreboard-card{animation:none!important}
#ciao-miniapp-root [data-live-slot]{transition:opacity .16s ease,color .16s ease}

@keyframes boardPulse{0%{box-shadow:0 0 0 0 rgba(255,82,111,.42)}70%{box-shadow:0 0 0 7px rgba(255,82,111,0)}100%{box-shadow:0 0 0 0 rgba(255,82,111,0)}}
@media(max-width:390px){
  #ciao-miniapp-root .scoreboard-card{padding-left:10px;padding-right:10px}
  #ciao-miniapp-root .scoreboard-main{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:5px}
  #ciao-miniapp-root .board-team .logo{width:40px!important;height:40px!important;flex-basis:40px!important}
  #ciao-miniapp-root .board-team-name{font-size:11px}
  #ciao-miniapp-root .board-score{min-width:82px;font-size:25px}
  #ciao-miniapp-root .mine-match{gap:8px}
  #ciao-miniapp-root .mine-prediction{min-width:58px;padding-left:7px;padding-right:7px;font-size:12px}
  #ciao-miniapp-root .mine-team{font-size:12px;gap:6px}
  #ciao-miniapp-root .mine-team .logo{width:23px!important;height:23px!important;flex-basis:23px!important}
}
</style>

<div id="ciao-miniapp-root">
<div class="app">
  <div class="header"><div class="brand"><span class="brand-logo" aria-hidden="true"></span><div><h1>Ciao, Web!</h1><small>Serie A 2026/27</small></div></div></div>
  <main id="ciao-main" class="content"><div class="loader"><div class="loader-box"><div class="loader-mark"></div><div class="loader-title">Ciao, Web!</div><div class="loader-sub">Подгружаем матчи, прогнозы и таблицу…</div></div></div></main>
</div>
<div class="nav"><div class="nav-inner">
  <button data-tab="predict" class="active"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.8 6.9 10 10l-2.2 2.2 1.2 3.1 3 .5 2.2-2.1 3.1.5 1.1-3-2.2-2.2.7-3.1"/></svg></b><span class="nav-label">Прогноз</span></button>
  <button data-tab="mine"><b><svg viewBox="0 0 24 24"><path d="M7 4.5h10a2 2 0 0 1 2 2v13H5v-13a2 2 0 0 1 2-2Z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg></b><span class="nav-label">Мои<br>прогнозы</span></button>
  <button data-tab="table"><b><svg viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5.5v1.5A3.5 3.5 0 0 0 9 10M16 5h2.5v1.5A3.5 3.5 0 0 1 15 10M12 11v4M8.5 20h7M9.5 15h5l1 5h-7l1-5Z"/></svg></b><span class="nav-label">Таблица</span></button>
  <button data-tab="calendar"><b><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 9.5h16M8 13h2M12 13h2M16 13h1M8 16h2M12 16h2"/></svg></b><span class="nav-label">Матчи</span></button>
  <button data-tab="seriea"><b><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h14M5 20h14"/><path d="M8 3v18M16 3v18"/></svg></b><span class="nav-label">Серия А</span></button>
  <button data-tab="profile"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19c.8-3.4 3.2-5.2 6.5-5.2s5.7 1.8 6.5 5.2"/></svg></b><span class="nav-label">Профиль</span></button>
</div></div>
<div id="ciao-toast" class="toast"></div>
</div>
<script>
(() => {
  const root = document.getElementById('ciao-miniapp-root');

  // КРИТИЧНО ДЛЯ TILDA/iOS:
  // T123 живёт внутри .t-rec/#allrecords, которые Tilda может держать opacity:0
  // до завершения своей загрузки. Выносим приложение прямо в body.
  try {
    if (root && document.body && root.parentNode !== document.body) {
      document.body.appendChild(root);
    }
    root.style.setProperty('display','block','important');
    root.style.setProperty('opacity','1','important');
    root.style.setProperty('visibility','visible','important');
    document.documentElement.style.setProperty('opacity','1','important');
    document.documentElement.style.setProperty('visibility','visible','important');
    document.body.style.setProperty('opacity','1','important');
    document.body.style.setProperty('visibility','visible','important');
    document.body.style.setProperty('background','#0f171f','important');

    const all = document.getElementById('allrecords');
    if (all) {
      all.style.setProperty('display','none','important');
      all.style.setProperty('opacity','0','important');
      all.style.setProperty('visibility','hidden','important');
    }
  } catch(e) {}

  const tg = window.Telegram?.WebApp || {};
  function applyViewport(){
    const live=Number(window.Telegram?.WebApp?.viewportHeight||0);
    const stable=Number(window.Telegram?.WebApp?.viewportStableHeight||0);
    const h=Math.max(320, live||stable||window.innerHeight||document.documentElement.clientHeight||600);
    root.style.setProperty('--ciao-vh', h+'px');
    const area=window.Telegram?.WebApp?.contentSafeAreaInset||window.Telegram?.WebApp?.safeAreaInset||{};
    if(Number.isFinite(Number(area.bottom))) root.style.setProperty('--ciao-safe-bottom',Math.max(0,Number(area.bottom))+'px');
    const nav=root.querySelector('.nav');
    if(nav){requestAnimationFrame(()=>root.style.setProperty('--ciao-nav-h',Math.max(56,Math.ceil(nav.getBoundingClientRect().height))+'px'));}
  }
  const main = root.querySelector('#ciao-main');
  const DIAG='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-miniapp-api';
  function diag(stage){
    try{
      const i=new Image();
      i.style.display='none';
      i.src=DIAG+'?stage='+encodeURIComponent(stage)+'&v=7&t='+Date.now();
      document.body.appendChild(i);
    }catch(e){}
  }
  diag('dom-detached');

  // Важно: ready вызываем ещё раз ПОСЛЕ переноса root в body.
  try { window.__ciaoNativePost?.('web_app_ready'); window.__ciaoNativePost?.('web_app_expand'); } catch(e) {}
  try { tg?.ready?.(); tg?.expand?.(); tg?.disableVerticalSwipes?.(); } catch(e) {}
  applyViewport();
  try { tg?.onEvent?.('viewportChanged', applyViewport); } catch(e) {}
  window.addEventListener('resize',applyViewport,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(applyViewport,120),{passive:true});
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden';
  try { tg?.setHeaderColor?.('secondary_bg_color'); tg?.setBackgroundColor?.('bg_color'); } catch(e) {}
  function initDataFromUrl(){
    try {
      const variants=[location.search.replace(/^\?/,''),location.hash.replace(/^#/, '')];
      for(const raw of variants){
        const p=new URLSearchParams(raw);
        const x=p.get('tgWebAppData');
        if(x) return x;
      }
    } catch(e) {}
    return '';
  }
  async function waitInitData(){
    for(let i=0;i<30;i++){
      const x=window.Telegram?.WebApp?.initData || initDataFromUrl();
      if(x) return x;
      await new Promise(r=>setTimeout(r,100));
    }
    return '';
  }
  let initData = '';
  const toastEl = root.querySelector('#ciao-toast');
  let S = null, tab = 'predict', selectedRound = null, draft = new Map();
  const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const USER_TIME_ZONE=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Rome'}catch(_e){return 'Europe/Rome'}})(); const fmt = iso => iso ? new Intl.DateTimeFormat('ru-RU',{timeZone:USER_TIME_ZONE,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',',' ·') : 'время уточняется';
  const API_BASE = 'https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-core-api-fast-v4'; // backend для GitHub Pages
  const MATCH_CENTER_API = 'https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-match-center';
  let matchViewId=null, matchData=null, matchReturnTab='calendar', matchLoading=false, matchCenterTab='overview';
  const LOADER_HTML = `<div class="loader"><div class="loader-box"><div class="loader-mark"></div><div class="loader-title">Ciao, Web!</div><div class="loader-sub">Подгружаем матчи, прогнозы и таблицу…</div></div></div>`;
  const api = async (body) => { const r=await fetch(API_BASE,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify(body)}); let j={}; try{j=await r.json()}catch(_e){} if(!r.ok||!j.ok){const e=new Error(j.error||'Ошибка');e.status=r.status;e.payload=j;throw e;} return j; };
  const matchApi = async (matchId) => { const r=await fetch(MATCH_CENTER_API,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify({match_id:Number(matchId)})}); const j=await r.json(); if(!r.ok||!j.ok) throw new Error(j.error||'Не удалось загрузить статистику матча'); return j; };
  const logo = t => t?.custom_emoji_id ? `<img class="logo" loading="lazy" decoding="async" fetchpriority="low" src="${API_BASE}?asset=emoji&id=${encodeURIComponent(t.custom_emoji_id)}" alt="">` : '<span class="logo">⚽</span>';
  function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800);try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
  function roundBar(){return `<div class="rounds">${S.rounds.map(r=>`<button class="round-chip ${r.number===S.selected_round?'active':''} ${r.unlocked?'':'locked'}" data-round="${r.number}" ${r.unlocked?'':'disabled'}>${r.unlocked?r.number:'🔒 '+r.number}</button>`).join('')}</div>`}
  function hero(){return `<div class="hero"><div class="hero-top"><div><h2>${esc(S.user.display_name)}</h2><p>${S.user.username?'@'+esc(S.user.username):'Игрок Ciao, Web!'}</p></div><div><div class="rank">#${S.stats.rank}</div><p>место</p></div></div></div>`}
  function scoreOf(m){const d=draft.get(m.id); if(d) return d; const p=m.prediction; return {h:p?.home_score??0,a:p?.away_score??0};}
  const isLive=m=>String(m?.live_status??'').toLowerCase()==='live';
  const liveTag=m=>`<span class="live-pill"><i class="live-dot"></i>LIVE${m?.live_elapsed!=null?` · ${Number(m.live_elapsed)}′`:''}</span>`;
  const liveScore=m=>(m?.home_score!=null&&m?.away_score!=null)?`${m.home_score}:${m.away_score}`:'—';
  function predict(){
    const m=S.round.matches;
    return hero()+roundBar()+`<div class="section-title"><h3>${S.selected_round}-й тур</h3><span>дедлайн −15 минут</span></div><div class="matches">`+m.map(x=>{const v=scoreOf(x);const live=isLive(x);return `<div class="match ${x.open?'':'closed'}" data-mid="${x.id}"><div class="match-head"><div class="teams"><div class="team">${logo(x.home)}<span class="team-name">${esc(x.home.name)}</span></div><span class="dash">—</span><div class="team away"><span class="team-name">${esc(x.away.name)}</span>${logo(x.away)}</div></div></div>${live?`<div class="live-row">${liveTag(x)}<span class="live-score">${liveScore(x)}</span></div>`:''}${x.open?`<div class="score"><div class="score-side"><button data-delta="h:-1">−</button><div class="score-value">${v.h}</div><button data-delta="h:1">+</button></div><span class="colon">:</span><div class="score-side"><button data-delta="a:-1">−</button><div class="score-value">${v.a}</div><button data-delta="a:1">+</button></div></div>`:''}<div class="meta"><span>Начало матча: ${fmt(x.kickoff_at)}</span><span>${x.is_finished?`Итог ${x.home_score}:${x.away_score}`:live?'матч идёт':x.open?predictionStatusHtml(x):'🔒 закрыт'}</span></div></div>`}).join('')+`</div><div class="savebar"><button id="saveAll" class="save">Сохранить прогнозы на тур</button></div>`;
  }
  function mine(){return hero()+roundBar()+`<div class="section-title"><h3>Мои прогнозы · ${S.selected_round}-й тур</h3></div><div class="card mine-card">`+S.round.matches.map(x=>{const p=x.prediction,live=isLive(x);const pts=p?.points!=null?` · +${p.points}`:'';return `<div class="mine-match" data-mid="${x.id}"><div class="mine-main"><div class="mine-pair"><div class="mine-team">${logo(x.home)}<span>${esc(x.home.name)}</span></div><span class="mine-dash">—</span><div class="mine-team away"><span>${esc(x.away.name)}</span>${logo(x.away)}</div></div><div class="mine-meta"><span>${fmt(x.kickoff_at)}</span><span class="mine-live" data-live-slot="mine-live">${live?`LIVE${x.live_elapsed!=null?` · ${x.live_elapsed}′`:''} · ${liveScore(x)}`:x.is_finished?`ИТОГ · ${liveScore(x)}`:''}</span></div></div><div class="mine-prediction ${p?.points!=null?'has-points':''}" data-live-slot="mine-prediction">${p?`${p.home_score}:${p.away_score}${pts}`:'—'}</div></div>`}).join('')+`</div>`}
  function table(){return hero()+`<div class="section-title"><h3>Общая таблица</h3><span>${S.standings.length} игроков</span></div><div class="card">`+S.standings.map((x,i)=>`<div class="list-row ${x.id===S.user.id?'me':''}"><div class="pos">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="person">${esc(x.display_name)}</div><div class="pts">${x.points}</div></div>`).join('')+`</div>`}
  const boardState=m=>isLive(m)?'live':m?.is_finished?'finished':'upcoming';
  const boardStatus=m=>isLive(m)?`LIVE${m?.live_elapsed!=null?` · ${Number(m.live_elapsed)}′`:''}`:m?.is_finished?'Матч завершён':'Матч не начался';
  const boardScore=m=>(isLive(m)||m?.is_finished)&&m?.home_score!=null&&m?.away_score!=null?`${m.home_score}:${m.away_score}`:'— : —';
  const boardCaption=m=>isLive(m)?'счёт обновляется автоматически':m?.is_finished?'финальный счёт':'ожидаем начало';
  function calendar(){return roundBar()+`<div class="section-title"><h3>Матчи · ${S.selected_round}-й тур</h3><span>Live-центр</span></div><div class="scoreboards">`+S.round.matches.map(x=>`<div class="scoreboard-card ${boardState(x)}" data-mid="${x.id}"><div class="scoreboard-top"><span class="board-status" data-live-slot="board-status">${boardStatus(x)}</span><span class="board-kickoff">${fmt(x.kickoff_at)}</span></div><div class="scoreboard-main"><div class="board-team">${logo(x.home)}<div class="board-team-name">${esc(x.home.name)}</div></div><div class="board-center"><div class="board-score ${boardState(x)==='upcoming'?'waiting':''}" data-live-slot="board-score">${boardScore(x)}</div><div class="board-caption" data-live-slot="board-caption">${boardCaption(x)}</div></div><div class="board-team">${logo(x.away)}<div class="board-team-name">${esc(x.away.name)}</div></div></div></div>`).join('')+`</div>`}
  function profile(){return hero()+`<div class="stats-grid"><div class="stat"><b>${S.stats.points}</b><span>Очки</span></div><div class="stat"><b>${S.stats.exact}</b><span>Точных счетов</span></div><div class="stat"><b>${S.stats.successful}</b><span>Удачных прогнозов</span></div><div class="stat"><b>${S.stats.calculated}</b><span>Рассчитано матчей</span></div></div><div class="card" style="margin-top:10px"><div class="settings-row"><div><b>Напоминания о дедлайнах</b><div style="font-size:12px;color:var(--muted);margin-top:3px">За 3 часа и за 30 минут до дедлайна</div></div><button id="remSwitch" class="switch ${S.user.reminders?'on':''}"><i></i></button></div></div>`}
  function serieA(){
    const t=S?.serie_a_table, rows=Array.isArray(t?.rows)?t.rows:[];
    if(!rows.length)return hero()+`<div class="section-title"><h3>Серия А</h3><span>2026/27</span></div><div class="empty">Турнирная таблица пока недоступна</div>`;
    const updated=t?.updated_at?`Обновлено ${new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(t.updated_at))}`:'2026/27';
    return hero()+`<div class="section-title"><h3>Серия А</h3><span>${esc(updated)}</span></div><div class="card serie-card"><div class="serie-head"><span>#</span><span>Команда</span><span>И</span><span>РМ</span><span>О</span></div>`+rows.map(r=>{
      const pos=Number(r.position)||0,gd=Number(r.goal_difference)||0,top=pos>0&&pos<=4,bottom=pos>=18;
