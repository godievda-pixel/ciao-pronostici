<style>

#3150ff,#162dc7);cursor:pointer}.btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cdd7f0}.btn.warning{background:rgba(240,199,99,.13);border:1px solid rgba(240,199,99,.28);color:#ffe3a0}.btn.danger{background:rgba(255,104,125,.13);border:1px solid rgba(255,104,125,.28);color:#ff9aaa}.btn:disabled{opacity:.42;cursor:not-allowed}.admin-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}.admin-table{width:100%;min-width:720px;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid rgba(130,151,221,.08);text-align:left;font-size:12px}.admin-table th{color:#7f90ba;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.025)}.admin-table tr:last-child td{border-bottom:0}.team-pair{font-weight:850}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#7d8bab}.dot.green{background:var(--green);box-shadow:0 0 14px rgba(73,215,154,.4)}.dot.yellow{background:var(--yellow);box-shadow:0 0 14px rgba(240,199,99,.3)}.dot.red{background:var(--red);box-shadow:0 0 14px rgba(255,104,125,.34)}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.tiny{min-height:30px;padding:0 9px;font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025)}.metric b{display:block;font-size:18px}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}.section-title h2{margin:0;font-size:16px}.section-title span{font-size:11px;color:var(--muted)}.system-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.service-card{border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.025)}.service-head{display:flex;justify-content:space-between;gap:8px}.service-card h3{font-size:12px;margin:0}.service-meta{margin-top:9px;font-size:10px;color:var(--muted);line-height:1.55}.flag-list{display:grid;gap:1px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.flag-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:rgba(255,255,255,.025);border-bottom:1px solid rgba(130,151,221,.08)}.flag-row:last-child{border-bottom:0}.flag-copy b{font-size:12px}.flag-copy span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}.switch{width:44px;height:26px;border-radius:999px;border:0;padding:3px;background:#202b48;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#e7ecfb;transition:.16s}.switch.on{background:linear-gradient(180deg,#3150ff,#091BBD)}.switch.on i{transform:translateX(18px)}.release-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.release-box{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.025)}.release-box span{font-size:10px;color:var(--muted)}.release-box b{display:block;margin-top:6px;font-size:11px;word-break:break-all}.notice{padding:14px;border-radius:15px;border:1px solid rgba(240,199,99,.2);background:rgba(240,199,99,.07);color:#f7dd9a;font-size:12px;line-height:1.55}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,460px);text-align:center}.auth-card h1{font-size:22px}.auth-card p{color:var(--muted);line-height:1.6}.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(1,5,16,.78);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.modal{width:min(100%,520px);max-height:88vh;overflow:auto;border:1px solid rgba(131,153,229,.2);border-radius:22px;background:#0a1430;padding:18px;box-shadow:0 30px 100px rgba(0,0,0,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.modal-head h3{margin:0;font-size:16px}.modal-close{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;right:20px;bottom:20px;z-index:150;max-width:360px;border-radius:13px;padding:12px 14px;background:#111d3e;border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px}.toast.error{border-color:rgba(255,104,125,.3);color:#ffb0bd}.loading{opacity:.58;pointer-events:none}
@media(max-width:980px){.system-grid{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.admin-shell{grid-template-columns:1fr}.admin-nav{position:sticky;top:0;height:auto;display:flex;overflow-x:auto;z-index:20;padding:10px;background:rgba(5,10,24,.97);border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}.nav-list{display:flex;gap:7px}.nav-btn{white-space:nowrap;padding:10px 12px}.admin-main{padding:14px}.topbar{margin-top:4px}.topbar h1{font-size:20px}.grid,.system-grid,.release-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}.admin-table{min-width:720px}.admin-table-wrap{overflow-x:auto}.form-grid{grid-template-columns:1fr}.modal-backdrop{padding:10px}.modal{border-radius:18px}.admin-id{display:none}}

<body>
<div id="auth" class="auth-screen"><div class="card auth-card"><h1>Ciao, Web! Admin</h1><p id="authText">Проверяем доступ…</p></div></div>
<div id="app" class="admin-shell hidden">
  <aside class="admin-nav"><div class="brand"><b>Ciao, Web!</b><span>Control Center</span></div><div class="nav-list">
    <button class="nav-btn active" data-tab="matches">Матчи</button>
    <button class="nav-btn" data-tab="scoring">Прогнозы и очки</button>
    <button class="nav-btn" data-tab="system">Система</button>
  </div></aside>
  <main class="admin-main"><div class="topbar"><div><h1 id="pageTitle">Матчи</h1><p id="pageSub">Управление расписанием и официальными результатами</p></div><div class="admin-id" id="adminId"></div></div><div id="content"></div></main>
</div>
<div id="modalHost"></div><div id="toast" class="toast hidden"></div>
<script>
const ADMIN_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-admin-api';
const tg=window.Telegram?.WebApp;const initData=tg?.initData||'';const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={admin:null,tab:'matches',matches:[],scoring:null,system:null,round:0,status:'all'};
async function api(action,payload={}){const r=await fetch(ADMIN_API,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const e=new Error(j.error||'Ошибка админ-панели');e.status=r.status;throw e}return j}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(error?' error':'');el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2600)}
function setLoading(v){$('#content')?.classList.toggle('loading',!!v)}
function closeModal(){$('#modalHost').innerHTML=''}
function modal(title,body,actions=''){const h=$('#modalHost');h.innerHTML=`<div class="modal-backdrop" data-close-bg><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="modal-close" data-close>×</button></div>${body}<div class="modal-actions">${actions}</div></div></div>`;h.querySelector('[data-close]')?.addEventListener('click',closeModal);h.querySelector('[data-close-bg]')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()})}
function uuid(){return crypto.randomUUID()}
const fmt=x=>x?new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(x)):'—';
const statusText=m=>m.is_finished?'Завершён':String(m.live_status||'').toLowerCase().includes('live')?'Live':'Ожидается';
async function boot(){tg?.ready?.();tg?.expand?.();if(!initData){$('#authText').textContent='Откройте админ-панель через Telegram.';return}try{const s=await api('session');state.admin=s.admin;$('#adminId').innerHTML=`${esc(s.admin.display_name)}<br><span class="muted">${s.admin.username?'@'+esc(s.admin.username):'Telegram ID '+s.admin.telegram_id}</span>`;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');bindNav();await show('matches')}catch(e){$('#authText').textContent=e.status===403?'У вас нет доступа к админ-панели.':'Не удалось подтвердить доступ. Откройте панель заново через Telegram.'}}
function bindNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab))}
async function show(tab){state.tab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const titles={matches:['Матчи','Управление расписанием и официальными результатами'],scoring:['Прогнозы и очки','Схема начисления, x2 и безопасный пересчёт'],system:['Система','Health, feature flags, maintenance и rollback']};$('#pageTitle').textContent=titles[tab][0];$('#pageSub').textContent=titles[tab][1];setLoading(true);try{if(tab==='matches')await loadMatches();if(tab==='scoring')await loadScoring();if(tab==='system')await loadSystem()}catch(e){toast(e.message,true);$('#content').innerHTML=`<div class="notice">Не удалось загрузить раздел. ${esc(e.message)}</div>`}finally{setLoading(false)}}
async function loadMatches(){const r=await api('matches',{round:state.round||undefined,status:state.status});state.matches=r.matches||[];renderMatches()}
function renderMatches(){const rounds=[...new Set(state.matches.map(m=>m.round).filter(Boolean))].sort((a,b)=>a-b);$('#content').innerHTML=`<div class="card"><div class="toolbar"><div class="field"><label>Тур</label><select class="control" id="roundFilter"><option value="0">Все</option>${rounds.map(x=>`<option value="${x}" ${state.round===x?'selected':''}>${x}-й тур</option>`).join('')}</select></div><div class="field"><label>Статус</label><select class="control" id="statusFilter"><option value="all">Все</option><option value="upcoming">Будущие</option><option value="live">Live</option><option value="finished">Завершённые</option></select></div><div class="field" style="align-self:end"><button class="btn secondary" id="refreshMatches">Обновить</button></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Тур</th><th>Матч</th><th>Время</th><th>Счёт</th><th>Статус</th><th>Источник</th><th>Действия</th></tr></thead><tbody>${state.matches.map(m=>`<tr><td>${m.round??'—'}</td><td class="team-pair">${esc(m.home?.short_name||m.home?.name||'—')} — ${esc(m.away?.short_name||m.away?.name||'—')}</td><td>${fmt(m.kickoff_at)}</td><td>${m.home_score==null?'—':m.home_score+':'+m.away_score}</td><td><span class="status"><i class="dot ${m.is_finished?'green':String(m.live_status||'').toLowerCase().includes('live')?'yellow':''}"></i>${statusText(m)}${m.result_locked?' · 🔒':''}</span></td><td class="muted">${esc(m.result_source||'—')}</td><td><div class="row-actions"><button class="btn secondary tiny" data-action="result" data-id="${m.id}">Счёт</button><button class="btn secondary tiny" data-action="kickoff" data-id="${m.id}">Время</button><button class="btn secondary tiny" data-action="lock" data-id="${m.id}">${m.result_locked?'Unlock':'Lock'}</button><button class="btn secondary tiny" data-action="sync" data-id="${m.id}">Sync</button><button class="btn warning tiny" data-action="rescore" data-id="${m.id}">Пересчёт</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Матчей по фильтру нет</td></tr>'}</tbody></table></div></div>`;$('#statusFilter').value=state.status;$('#roundFilter').onchange=async e=>{state.round=Number(e.target.value)||0;await loadMatches()};$('#statusFilter').onchange=async e=>{state.status=e.target.value;await loadMatches()};$('#refreshMatches').onclick=loadMatches;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>matchAction(b.dataset.action,Number(b.dataset.id)))}
function matchAction(action,id){const m=state.matches.find(x=>Number(x.id)===id);if(!m)return;if(action==='result')return resultModal(m);if(action==='kickoff')return kickoffModal(m);if(action==='lock')return simpleMutation('Изменить блокировку',m.result_locked?'Разблокировать официальный результат?':'Заблокировать официальный результат?',m.result_locked?'match_lock':'match_lock',{match_id:id,locked:!m.result_locked},'Статус блокировки обновлён');if(action==='sync')return simpleMutation('Обновить матч','Запустить синхронизацию этого матча с источником?', 'match_sync',{match_id:id},'Синхронизация запущена');if(action==='rescore')return simpleMutation('Пересчитать матч','Пересчитать очки всех прогнозов по финальному результату?', 'match_rescore',{match_id:id},'Очки пересчитаны')}
function reasonField(){return `<div class="field"><label>Причина изменения</label><textarea class="control" id="modalReason" placeholder="Например: исправлен официальный результат"></textarea></div>`}
function resultModal(m){modal('Результат матча',`<div class="form-grid"><div class="field"><label>${esc(m.home?.name||'Хозяева')}</label><input class="control" id="homeScore" type="number" min="0" value="${m.home_score??0}"></div><div class="field"><label>${esc(m.away?.name||'Гости')}</label><input class="control" id="awayScore" type="number" min="0" value="${m.away_score??0}"></div></div><div class="form-grid" style="margin-top:10px"><label><input type="checkbox" id="isFinished" ${m.is_finished?'checked':''}> Финальный результат</label><label><input type="checkbox" id="lockResult" ${m.result_locked?'checked':''}> Заблокировать</label></div><div style="margin-top:12px">${reasonField()}</div>`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn danger" data-submit>Сохранить результат</button>`);$('[data-cancel]').onclick=closeModal;$('[data-submit]').onclick=async()=>{const reason=$('#modalReason').value.trim();if(reason.length<3)return toast('Укажите причину',true);try{await api('match_override_result',{request_id:uuid(),match_id:m.id,home_score:Number($('#homeScore').value),away_score:Number($('#awayScore').value),is_finished:$('#isFinished').checked,lock:$('#lockResult').checked,reason});closeModal();toast('Результат сохранён');await loadMatches()}catch(e){toast(e.message,true)}}}
function kickoffModal(m){const local=m.kickoff_at?new Date(new Date(m.kickoff_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';modal('Изменить время начала',`<div class="field"><label>Дата и время</label><input class="control" id="kickoffValue" type="datetime-local" value="${local}"></div><div style="margin-top:12px">${reasonField()}</div>`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn" data-submit>Сохранить</button>`);$('[data-cancel]').onclick=closeModal;$('[data-submit]').onclick=async()=>{const reason=$('#modalReason').value.trim(),d=new Date($('#kickoffValue').value);if(reason.length<3)return toast('Укажите причину',true);if(!Number.isFinite(d.getTime()))return toast('Некорректное время',true);try{await api('match_kickoff',{request_id:uuid(),match_id:m.id,kickoff_at:d.toISOString(),reason});closeModal();toast('Время обновлено');await loadMatches()}catch(e){toast(e.message,true)}}}
function simpleMutation(title,copy,action,payload,ok){modal(title,`<p class="muted">${esc(copy)}</p>${reasonField()}`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn warning" data-submit>Продолжить</button>`);$('[data-cancel]').onclick=closeModal;$('[data-submit]').onclick=async()=>{const reason=$('#modalReason').value.trim();if(reason.length<3)return toast('Укажите причину',true);try{await api(action,{request_id:uuid(),reason,...payload});closeModal();toast(ok);if(state.tab==='matches')await loadMatches();if(state.tab==='scoring')await loadScoring()}catch(e){toast(e.message,true)}}}
async function loadScoring(){state.scoring=await api('scoring');renderScoring()}
function renderScoring(){const r=state.scoring.rules||{},rounds=state.scoring.round_settings||[];$('#content').innerHTML=`<div class="card"><div class="section-title"><h2>Схема начисления</h2><span>Любое изменение пересчитает завершённые прогнозы</span></div><div class="stats-grid"><div class="field"><label>Точный счёт</label><input class="control" id="ruleExact" type="number" min="0" value="${r.exact_score??5}"></div><div class="field"><label>Разница</label><input class="control" id="ruleDiff" type="number" min="0" value="${r.correct_goal_difference??3}"></div><div class="field"><label>Исход</label><input class="control" id="ruleOutcome" type="number" min="0" value="${r.correct_outcome??2}"></div><div class="field"><label>Промах</label><input class="control" id="ruleMiss" type="number" min="0" value="${r.miss??0}"></div><div class="field"><label>x2 множитель</label><input class="control" id="ruleBonus" type="number" min="1" max="10" value="${r.bonus_multiplier??2}"></div></div><div style="margin-top:14px"><button class="btn danger" id="saveScoring">Изменить правила</button></div></div><div class="card" style="margin-top:14px"><div class="section-title"><h2>x2 по турам</h2><span>Отключение не удаляет выбранные бонусы</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Тур</th><th>x2</th><th>Изменено</th><th>Действия</th></tr></thead><tbody>${rounds.map(x=>`<tr><td>${x.round}</td><td>${x.bonus_enabled?'Включён':'Отключён'}</td><td class="muted">${fmt(x.updated_at)}</td><td><div class="row-actions"><button class="btn secondary tiny" data-bonus-round="${x.round_id}" data-enabled="${x.bonus_enabled?'1':'0'}">${x.bonus_enabled?'Отключить x2':'Включить x2'}</button><button class="btn warning tiny" data-rescore-round="${x.round_id}">Пересчитать тур</button></div></td></tr>`).join('')}</tbody></table></div></div>`;$('#saveScoring').onclick=scoringModal;document.querySelectorAll('[data-bonus-round]').forEach(b=>b.onclick=()=>simpleMutation('Настройка x2',b.dataset.enabled==='1'?'Отключить x2 в этом туре?':'Включить x2 в этом туре?','round_bonus_setting',{round_id:Number(b.dataset.bonusRound),bonus_enabled:b.dataset.enabled!=='1'},'Настройка x2 сохранена'));document.querySelectorAll('[data-rescore-round]').forEach(b=>b.onclick=()=>simpleMutation('Пересчёт тура','Пересчитать все завершённые матчи этого тура?','round_rescore',{round_id:Number(b.dataset.rescoreRound)},'Тур пересчитан'))}
function scoringModal(){const values={exact_score:Number($('#ruleExact').value),correct_goal_difference:Number($('#ruleDiff').value),correct_outcome:Number($('#ruleOutcome').value),miss:Number($('#ruleMiss').value),bonus_multiplier:Number($('#ruleBonus').value)};modal('Подтвердить изменение правил',`<div class="notice">Это действие пересчитает очки по всем уже завершённым матчам.</div><div class="field" style="margin-top:12px"><label>Введите ПОДТВЕРДИТЬ</label><input class="control" id="confirmWord" autocomplete="off"></div><div style="margin-top:12px">${reasonField()}</div>`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn danger" data-submit disabled>Изменить правила</button>`);const c=$('#confirmWord'),r=$('#modalReason'),submit=$('[data-submit]');const valid=()=>submit.disabled=!(c.value.trim()==='ПОДТВЕРДИТЬ'&&r.value.trim().length>=3);c.oninput=r.oninput=valid;$('[data-cancel]').onclick=closeModal;submit.onclick=async()=>{try{await api('scoring_update',{request_id:uuid(),confirmation:'ПОДТВЕРДИТЬ',reason:r.value.trim(),...values});closeModal();toast('Правила изменены, очки пересчитаны');await loadScoring()}catch(e){toast(e.message,true)}}}
async function loadSystem(){state.system=await api('system');renderSystem()}
function featureDescription(k){return({maintenance_mode:'Перевести пользовательское приложение в read-only',notifications:'Глобальная отправка Telegram-уведомлений',round_center:'Центр тура (v20)',live_predictor_table:'Live-рейтинг прогнозистов (v20)',prediction_history:'История прогнозов (v20)',live_serie_a:'Live-таблица Серии А (v21)',club_advanced_stats:'Расширенная статистика клубов (v21)',match_compare:'Сравнение команд (v21)',achievements:'Достижения (v20)',share_cards:'Карточки итогов тура (v20)'})[k]||'Feature flag'}
function renderSystem(){const x=state.system,rs=x.release_state||{},services=x.services||[],features=x.features||[];$('#content').innerHTML=`<div class="card"><div class="section-title"><h2>Состояние сервисов</h2><button class="btn secondary tiny" id="refreshSystem">Обновить</button></div><div class="system-grid">${services.map(s=>`<div class="service-card"><div class="service-head"><h3>${esc(s.service_name)}</h3><span class="status"><i class="dot ${esc(s.status)}"></i>${esc(s.status)}</span></div><div class="service-meta">Latency: ${s.latency_ms??'—'} ms<br>Updated: ${fmt(s.updated_at)}<br>${s.error_code?'Ошибка: '+esc(s.error_code):'Последняя проверка без ошибки'}</div></div>`).join('')||'<div class="muted">Нет данных health</div>'}</div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="section-title"><h2>Feature Flags</h2><span>Server-side</span></div><div class="flag-list">${features.map(f=>`<div class="flag-row"><div class="flag-copy"><b>${esc(f.key)}</b><span>${esc(featureDescription(f.key))}</span></div><button class="switch ${f.enabled?'on':''}" data-flag="${esc(f.key)}" data-on="${f.enabled?'1':'0'}"><i></i></button></div>`).join('')}</div></div><div class="card"><div class="section-title"><h2>Frontend release</h2><span>Rollback registry</span></div><div class="release-grid"><div class="release-box"><span>Current</span><b>${esc(rs.current_build||'—')}</b></div><div class="release-box"><span>Previous stable</span><b>${esc(rs.previous_stable_build||'—')}</b></div><div class="release-box"><span>Fallback</span><b>${esc(rs.fallback_build||'—')}</b></div></div><div style="margin-top:13px"><button class="btn danger" id="rollbackBtn" ${(!rs.previous_stable_build&&rs.fallback_build===rs.current_build)?'disabled':''}>Rollback</button></div><div class="notice" style="margin-top:13px">Telegram menu остаётся на стабильном redirect URL. Rollback меняет только DB pointer.</div></div></div>`;$('#refreshSystem').onclick=loadSystem;document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>flagModal(b.dataset.flag,b.dataset.on!=='1'));$('#rollbackBtn').onclick=rollbackModal}
function flagModal(key,enabled){if(key==='maintenance_mode'){modal(enabled?'Включить maintenance':'Выключить maintenance',`<div class="notice">Maintenance переводит прогнозы в read-only режим.</div><div class="field" style="margin-top:12px"><label>Введите ПОДТВЕРДИТЬ</label><input class="control" id="confirmWord"></div>${reasonField()}`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn danger" data-submit disabled>Сохранить</button>`);const c=$('#confirmWord'),r=$('#modalReason'),s=$('[data-submit]'),v=()=>s.disabled=!(c.value.trim()==='ПОДТВЕРДИТЬ'&&r.value.trim().length>=3);c.oninput=r.oninput=v;$('[data-cancel]').onclick=closeModal;s.onclick=()=>saveFlag(key,enabled,r.value.trim(),'ПОДТВЕРДИТЬ');return}modal((enabled?'Включить ':'Выключить ')+key,`${reasonField()}`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn" data-submit>Сохранить</button>`);$('[data-cancel]').onclick=closeModal;$('[data-submit]').onclick=()=>{const reason=$('#modalReason').value.trim();if(reason.length<3)return toast('Укажите причину',true);saveFlag(key,enabled,reason,null)}}
async function saveFlag(key,enabled,reason,confirmation){try{await api('feature_flag_set',{request_id:uuid(),key,enabled,reason,confirmation});closeModal();toast('Feature flag обновлён');await loadSystem()}catch(e){toast(e.message,true)}}
function rollbackModal(){const rs=state.system.release_state||{},targets=[rs.previous_stable_build,rs.fallback_build].filter(x=>x&&x!==rs.current_build);if(!targets.length)return toast('Нет доступного rollback build',true);modal('Frontend rollback',`<div class="field"><label>Версия</label><select class="control" id="rollbackTarget">${[...new Set(targets)].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Введите ПОДТВЕРДИТЬ</label><input class="control" id="confirmWord"></div><div style="margin-top:12px">${reasonField()}</div>`,`<button class="btn secondary" data-cancel>Отмена</button><button class="btn danger" data-submit disabled>frontend_rollback</button>`);const c=$('#confirmWord'),r=$('#modalReason'),s=$('[data-submit]'),v=()=>s.disabled=!(c.value.trim()==='ПОДТВЕРДИТЬ'&&r.value.trim().length>=3);c.oninput=r.oninput=v;$('[data-cancel]').onclick=closeModal;s.onclick=async()=>{try{await api('frontend_rollback',{request_id:uuid(),confirmation:'ПОДТВЕРДИТЬ',reason:r.value.trim(),target_build:$('#rollbackTarget').value});closeModal();toast('Frontend переключён');await loadSystem()}catch(e){toast(e.message,true)}}}
boot();
</script>
</body>
</html>
