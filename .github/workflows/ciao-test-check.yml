name: Ciao TEST check

on:
  push:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'
      - '.github/workflows/ciao-test-check.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-test/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build TEST artifact
        run: npm run build

      - name: Validate TEST Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Observe v23.1 API contract
        run: npm run inspect:api-contract

      - name: Observe v23.3 prediction contract
        run: node scripts/probe-prediction-contract.mjs

      - name: Observe v23.3 reset contract
        run: node scripts/probe-reset-contract.mjs

      - name: Probe BSD provider contract
        run: node scripts/probe-bsd-provider.mjs

      - name: Probe deployed TEST markers
        if: github.event_name == 'push'
        run: node scripts/probe-test-deployment-v233.mjs

      - name: Probe deployed round5 TEST fixes
        if: github.event_name == 'push'
        run: node scripts/probe-round5-deployment.mjs

      - name: Probe deployed Round 18 Match Center
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round18-match-center.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 23 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round23-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 28 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round28-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 29 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round29-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 30 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round30-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 32 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round32-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Probe deployed Round 33 fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/probe-round33-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Upload v23.2 API contract observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-2-api-contract
          path: cloudflare-test/artifacts/api-contract-observed.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload v23.3 prediction contract observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-prediction-contract
          path: cloudflare-test/artifacts/v23-3-prediction-contract.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload v23.3 reset contract observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-reset-contract
          path: cloudflare-test/artifacts/v23-3-reset-contract.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload BSD provider observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-bsd-provider
          path: cloudflare-test/artifacts/bsd-provider-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload TEST deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-test-deployment
          path: cloudflare-test/artifacts/test-deployment-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload round5 TEST deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round5-test-deployment
          path: cloudflare-test/artifacts/v23-3-round5-live.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 18 Match Center deployment observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round18-match-center
          path: cloudflare-test/artifacts/v23-3-round18-match-center.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 23 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round23-deployment
          path: cloudflare-test/artifacts/v23-3-round23-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 28 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round28-deployment
          path: cloudflare-test/artifacts/v23-3-round28-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 29 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round29-deployment
          path: cloudflare-test/artifacts/v23-3-round29-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 30 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round30-deployment
          path: cloudflare-test/artifacts/v23-3-round30-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 32 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round32-deployment
          path: cloudflare-test/artifacts/v23-3-round32-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Round 33 deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-round33-deployment
          path: cloudflare-test/artifacts/v23-3-round33-deployment.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload authenticated prediction smoke when supplied manually
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-3-prediction-authenticated-smoke
          path: cloudflare-test/artifacts/v23-3-prediction-authenticated-smoke.json
          if-no-files-found: ignore
          retention-days: 7
