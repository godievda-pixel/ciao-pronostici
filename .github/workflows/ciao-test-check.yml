name: Ciao TEST check

on:
  push:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'
      - '.github/workflows/ciao-test-check.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-test/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build TEST artifact
        run: npm run build
