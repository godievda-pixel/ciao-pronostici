name: Ciao TEST check

on:
  push:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'
      - '.github/workflows/ciao-test-check.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'cloudflare-test/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secret availability
        if: github.event_name == 'push'
        shell: bash
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$BSD_API_KEY" ]; then echo 'BSD_API_KEY_PRESENT=true'; else echo 'BSD_API_KEY_PRESENT=false'; fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN_PRESENT=true'; else echo 'CLOUDFLARE_API_TOKEN_PRESENT=false'; fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'CLOUDFLARE_ACCOUNT_ID_PRESENT=true'; else echo 'CLOUDFLARE_ACCOUNT_ID_PRESENT=false'; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-test/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build TEST artifact
        run: npm run build

      - name: Observe v23.1 API contract
        if: github.event_name == 'push'
        run: npm run inspect:api-contract

      - name: Probe BSD provider contract
        if: github.event_name == 'push'
        run: node scripts/probe-bsd-provider.mjs

      - name: Probe deployed TEST markers
        if: github.event_name == 'push'
        run: node scripts/probe-test-deployment.mjs

      - name: Upload v23.2 API contract observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-2-api-contract
          path: cloudflare-test/artifacts/api-contract-observed.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload BSD provider observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-v23-2-bsd-provider
          path: cloudflare-test/artifacts/bsd-provider-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload TEST deployment observation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ciao-test-deployment-probe
          path: cloudflare-test/artifacts/test-deployment-probe.json
          if-no-files-found: error
          retention-days: 7
