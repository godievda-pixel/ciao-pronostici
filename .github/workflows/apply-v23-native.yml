name: Apply v23 native source on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v23-native.yml'
      - 'cloudflare-production/scripts/migrate-v23-native.py'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply native Predictions migration
        run: python3 cloudflare-production/scripts/migrate-v23-native.py
      - name: Install
        working-directory: cloudflare-production
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: cloudflare-production
        run: npm run build
      - name: Commit migrated v23 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-production/src/v23/index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'release: integrate native Predictions into v23 source'
          git pull --rebase origin main
          git push origin HEAD:main
