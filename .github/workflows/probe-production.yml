name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live GitHub production entry
        shell: bash
        run: |
          set -euo pipefail
          ENTRY='https://godievda-pixel.github.io/ciao-pronostici/'
          MARKER='ciao-web-app.ciao-web.workers.dev'
          for attempt in $(seq 1 24); do
            curl -fsS --max-time 20 "$ENTRY" -o /tmp/entry.html
            if grep -Fq "$MARKER" /tmp/entry.html; then
              echo "PRESENT on attempt $attempt: Cloudflare production allowlist"
              grep -Fq "u.hostname==='godievda-pixel.github.io'" /tmp/entry.html
              echo 'Live GitHub entry is ready for the Cloudflare manifest.'
              exit 0
            fi
            echo "ABSENT on attempt $attempt; waiting for GitHub Pages publish"
            sleep 10
          done
          echo 'GitHub Pages did not publish the production route fix within probe window'
          exit 1
