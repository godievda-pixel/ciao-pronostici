name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect render and bind runtime path
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/?render_probe=20260908-0925'
          curl -fsS --max-time 30 "$URL" -o /tmp/prod.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/prod.html').read_text()
          for name,pat in [
            ('render',r'function\s+render\s*\([^)]*\)\s*\{'),
            ('bind',r'function\s+bind\s*\([^)]*\)\s*\{'),
            ('render_assign',r'render\s*=\s*function\s*\([^)]*\)\s*\{'),
            ('bind_assign',r'bind\s*=\s*function\s*\([^)]*\)\s*\{'),
          ]:
              print('\n===',name,'===')
              matches=list(re.finditer(pat,text))
              print('count=',len(matches))
              for m in matches[:10]:
                  p=m.start()
                  print(text[max(0,p-700):p+2800].replace('\n','\\n'))
                  print('---')
          PY
