name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Require Telegram menu revision cache bust
        shell: bash
        run: |
          set -euo pipefail
          PROBE='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-telegram-entry-probe'
          EXPECT='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-web-app?tg_rev=20260908-0525'
          curl -fsS --max-time 20 "$PROBE" -o /tmp/tg-entry.json
          cat /tmp/tg-entry.json
          echo
          grep -Fq '"ok":true' /tmp/tg-entry.json
          grep -Fq "\"web_app_url\":\"$EXPECT\"" /tmp/tg-entry.json
          echo 'Telegram menu uses a fresh revision URL.'
