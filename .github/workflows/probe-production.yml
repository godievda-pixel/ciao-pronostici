name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Telegram production route contract
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-release-manifest-v1'
          ENTRY='https://godievda-pixel.github.io/ciao-pronostici/'
          WORKER='https://ciao-web-app.ciao-web.workers.dev'

          echo '=== release manifest ==='
          code=$(curl -sS --max-time 20 -o /tmp/manifest.json -w '%{http_code}' "$MANIFEST")
          cat /tmp/manifest.json
          echo
          echo "manifest_http=$code"
          test "$code" = '200'
          grep -Fq 'ciao-web-v22-5-cloudflare-standalone-20260830' /tmp/manifest.json
          grep -Fq "$WORKER" /tmp/manifest.json

          echo '=== GitHub entry allowlist ==='
          curl -fsS --max-time 20 "$ENTRY" -o /tmp/entry.html
          grep -Fq 'ciao-web-app.ciao-web.workers.dev' /tmp/entry.html

          echo 'Routing contract is coherent: GitHub entry accepts the active Cloudflare build.'
