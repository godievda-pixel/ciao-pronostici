name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production worker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/'
          echo "=== healthz ==="
          curl -fsS --max-time 20 "${URL}healthz" || true
          echo
          echo "=== root headers ==="
          curl -fsSIL --max-time 20 "$URL" | sed -n '1,30p'
          echo "=== root body ==="
          curl -fsS --max-time 20 "$URL" -o /tmp/prod.html
          wc -c /tmp/prod.html
          for marker in \
            'ciao-prod-home-calcio-polish-20260908' \
            'ciao-prod-home-calcio-safety-20260908' \
            'Кальчо сегодня' \
            'cw-home-profile-premium' \
            'cwpred-stage-locked'; do
            if grep -Fq "$marker" /tmp/prod.html; then
              echo "PRESENT: $marker"
            else
              echo "ABSENT: $marker"
            fi
          done
          echo "=== build marker candidates ==="
          grep -Eo 'ciao-web-v[0-9A-Za-z._-]+' /tmp/prod.html | sort -u | head -20 || true
