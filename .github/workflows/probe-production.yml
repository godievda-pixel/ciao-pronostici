name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Home bootstrap in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/'
          MARKER='try{__cwHomePolishDom();__cwHomeBindPolish()}catch(_e){}'
          for attempt in $(seq 1 18); do
            curl -fsS --max-time 20 "$URL" -o /tmp/prod.html
            if grep -Fq "$MARKER" /tmp/prod.html; then
              echo "PRESENT on attempt $attempt: Home bootstrap"
              grep -Fq 'Кальчо сегодня' /tmp/prod.html
              grep -Fq 'cw-home-profile-premium' /tmp/prod.html
              grep -Fq 'disabled aria-disabled="true" tabindex="-1"' /tmp/prod.html
              echo "Production contains bootstrap + Home/Calcio + locked-stage contracts"
              exit 0
            fi
            echo "ABSENT on attempt $attempt; waiting for Cloudflare Git deploy"
            sleep 10
          done
          echo 'Home bootstrap did not reach production within probe window'
          exit 1
