name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify revised Telegram entry end to end
        shell: bash
        run: |
          set -euo pipefail
          PROBE='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-telegram-entry-probe'
          ENTRY='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-web-app?tg_rev=20260908-0525'
          EXPECT='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-web-app?tg_rev=20260908-0525'
          UA='Mozilla/5.0 Telegram-Android/12.0 WebView'

          echo '=== Telegram menu ==='
          curl -fsS --max-time 20 "$PROBE" -o /tmp/tg.json
          cat /tmp/tg.json
          echo
          grep -Fq "\"web_app_url\":\"$EXPECT\"" /tmp/tg.json

          echo '=== revised launcher response ==='
          curl -sS --max-time 20 -A "$UA" -D /tmp/headers.txt -o /tmp/body "$ENTRY"
          cat /tmp/headers.txt
          grep -Eiq '^HTTP/[0-9.]+ 302' /tmp/headers.txt
          grep -Eiq '^location: https://ciao-web-app\.ciao-web\.workers\.dev/\?v=[0-9]+' /tmp/headers.txt
          grep -Eiq '^cache-control: .*no-store' /tmp/headers.txt

          echo '=== final production HTML ==='
          curl -fsSL --max-time 30 -A "$UA" "$ENTRY" -o /tmp/final.html
          grep -Fq 'try{__cwHomePolishDom();__cwHomeBindPolish()}catch(_e){}' /tmp/final.html
          grep -Fq 'Кальчо сегодня' /tmp/final.html
          grep -Fq 'cw-home-profile-premium' /tmp/final.html
          grep -Fq 'disabled aria-disabled="true" tabindex="-1"' /tmp/final.html
          echo "final_bytes=$(wc -c < /tmp/final.html)"
          echo 'REVISED TELEGRAM ENTRY VERIFIED END TO END'
