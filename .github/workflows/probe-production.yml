name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live content-derived Telegram release sync
        shell: bash
        run: |
          set -euo pipefail
          ROUTER='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-pronostici-router'
          PROBE='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-telegram-entry-probe'
          LAUNCHER='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-web-app'
          WORKER='https://ciao-web-app.ciao-web.workers.dev/'
          REV='e833e3ab9551'
          EXPECT="${LAUNCHER}?tg_rev=${REV}"

          echo '=== router v61 ==='
          curl -fsS --max-time 20 "$ROUTER" -o /tmp/router.json
          cat /tmp/router.json
          echo
          grep -Fq '"version":61' /tmp/router.json
          grep -Fq '"mode":"content_derived_release_revision"' /tmp/router.json
          grep -Fq "\"app_url\":\"$EXPECT\"" /tmp/router.json
          grep -Fq '"test_url":"https://ciao-web-app-test.ciao-web.workers.dev/"' /tmp/router.json
          grep -Fq '"admin_url":"https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-admin-web-v20"' /tmp/router.json

          echo '=== release sync ==='
          code=$(curl -sS --max-time 30 -o /tmp/sync.json -w '%{http_code}' "$ROUTER/release-sync?revision=$REV")
          cat /tmp/sync.json
          echo
          test "$code" = '200'
          grep -Fq '"ok":true' /tmp/sync.json
          grep -Fq "\"requested_revision\":\"$REV\"" /tmp/sync.json
          grep -Fq "\"live_revision\":\"$REV\"" /tmp/sync.json
          grep -Fq "\"web_app_url\":\"$EXPECT\"" /tmp/sync.json

          echo '=== Telegram propagation ==='
          matched=0
          for attempt in $(seq 1 24); do
            curl -fsS --max-time 20 "$PROBE" -o /tmp/tg.json
            cat /tmp/tg.json
            echo
            if grep -Fq "\"web_app_url\":\"$EXPECT\"" /tmp/tg.json; then
              matched=1
              echo "Telegram matched on attempt $attempt"
              break
            fi
            sleep 5
          done
          test "$matched" = '1'
          grep -Fq '"url":"https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-pronostici-router"' /tmp/tg.json
          grep -Fq '"pending_update_count":0' /tmp/tg.json

          echo '=== revised launcher -> Worker ==='
          curl -fsSL --max-time 30 -D /tmp/final-headers.txt -o /tmp/final.html "$EXPECT"
          FINAL_SHA=$(sha256sum /tmp/final.html | awk '{print $1}')
          echo "final_sha256=$FINAL_SHA"
          echo "final_revision=${FINAL_SHA:0:12}"
          test "${FINAL_SHA:0:12}" = "$REV"
          grep -Fq 'Кальчо сегодня' /tmp/final.html
          grep -Fq 'cw-home-profile-premium' /tmp/final.html
          grep -Fq 'disabled aria-disabled="true" tabindex="-1"' /tmp/final.html
          echo 'LIVE ROUTER V61 RELEASE SYNC VERIFIED END TO END'
