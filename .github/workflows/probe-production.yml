name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare production fingerprint headers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/'
          curl -sS --max-time 20 -D /tmp/head.txt -o /tmp/body.html "$URL"
          cat /tmp/head.txt
          echo "sha256=$(sha256sum /tmp/body.html | awk '{print $1}')"
          echo "bytes=$(wc -c < /tmp/body.html)"
          grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/head.txt
          echo 'Fingerprint inspection complete.'
