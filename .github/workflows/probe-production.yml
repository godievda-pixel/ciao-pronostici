name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Home renderer selectors
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/?selector_probe=20260908-0915'
          curl -fsS --max-time 30 "$URL" -o /tmp/prod.html
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/prod.html').read_text()
          needles=[
            'Сегодня в Серии А',
            'cw211-today',
            'cw211-home-shell',
            'cw211-profile-btn',
            "if(tab!=='predict'||__cwHomeExternalCenter)return",
            'function __cwHomePolishOrder',
            'try{__cwHomePolishDom();__cwHomeBindPolish()}catch(_e){}',
          ]
          for needle in needles:
              print('\n===',needle,'===')
              print('count=',text.count(needle))
              pos=text.find(needle)
              if pos>=0:
                  print(text[max(0,pos-700):pos+1500].replace('\n','\\n'))
          PY
