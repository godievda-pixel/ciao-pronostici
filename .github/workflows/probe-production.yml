name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect async Home overwrite paths
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ciao-web-app.ciao-web.workers.dev/?async_home_probe=20260908-0928'
          curl -fsS --max-time 30 "$URL" -o /tmp/prod.html
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/prod.html').read_text()
          needles=['function __cw18LoadFavorite','__cw18LoadFavorite=','function __cw20PatchFavoriteHome','__cw20PatchFavoriteHome=','__cw18FavoriteHome=','setTimeout(__cw18LoadFavorite,30)']
          for needle in needles:
              print('\n===',needle,'===')
              start=0;count=0
              while True:
                  p=text.find(needle,start)
                  if p<0: break
                  count+=1
                  print(text[max(0,p-900):p+3300].replace('\n','\\n'))
                  print('---')
                  start=p+len(needle)
                  if count>=8: break
              print('count=',count)
          PY
