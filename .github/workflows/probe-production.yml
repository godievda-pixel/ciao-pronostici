name: Probe deployed production

on:
  push:
    branches: [debug/probe-production-20260908]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Observe Telegram menu propagation
        shell: bash
        run: |
          set -euo pipefail
          PROBE='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-telegram-entry-probe'
          EXPECT='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-web-app?tg_rev=20260908-0525'
          for attempt in $(seq 1 12); do
            curl -fsS --max-time 20 "$PROBE" -o /tmp/tg-entry.json
            echo "attempt=$attempt"
            cat /tmp/tg-entry.json
            echo
            if grep -Fq "\"web_app_url\":\"$EXPECT\"" /tmp/tg-entry.json; then
              echo 'Telegram menu revision propagated.'
              exit 0
            fi
            sleep 5
          done
          echo 'Telegram menu never changed to expected revision URL.'
          exit 1
