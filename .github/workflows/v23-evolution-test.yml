name: v23 evolution TEST

on:
  push:
    branches: [v23-evolution-test]
  pull_request:
    branches: [v23-evolution-test]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
