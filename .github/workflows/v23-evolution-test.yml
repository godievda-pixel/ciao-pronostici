name: v23 evolution TEST

on:
  push:
    branches: [v23-evolution-test]
  pull_request:
    branches: [v23-evolution-test]

permissions:
  contents: write

jobs:
  freeze_baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.freeze.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: freeze
        name: Freeze exact stable v22.5 source if missing
        shell: bash
        run: |
          set -euo pipefail
          target='cloudflare-production/src/v22-5-evolution.html'
          if [ -f "$target" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            sha256sum "$target"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            'https://dkefzepiiudehhzbbrjn.supabase.co/storage/v1/object/public/ciao-miniapp/migration/v22-5-resolved-no-x2.html' \
            --output "$target"
          sha256sum "$target"
          grep -q 'ciao-prod-no-x2-20260903' "$target"
          grep -q '5 / 3 / 2 / 0' "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'chore: freeze stable v22.5 evolution baseline'
          git push origin HEAD:v23-evolution-test
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  verify:
    needs: freeze_baseline
    if: github.event_name == 'pull_request' || needs.freeze_baseline.outputs.changed != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
