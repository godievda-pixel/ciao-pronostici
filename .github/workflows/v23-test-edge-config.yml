name: v23 TEST Edge config

on:
  push:
    branches:
      - v23-test
    paths:
      - '.github/workflows/v23-test-edge-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure_and_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lcnwccnkkxaosxnfvjvr
      CHECK_URL: https://lcnwccnkkxaosxnfvjvr.supabase.co/functions/v1/ciao-v23-env-check
    steps:
      - name: Confirm management token is configured
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "supabase_access_token_configured=false"
            exit 2
          fi
          echo "supabase_access_token_configured=true"

      - name: Set TEST-only v23 runtime config
        run: >-
          npx --yes supabase@latest secrets set
          CIAO_ENVIRONMENT=test
          CIAO_ALLOWED_ORIGINS=https://ciao-web-v23-test.ciao-web.workers.dev
          --project-ref "$PROJECT_REF"

      - name: Verify only presence flags
        shell: bash
        run: |
          node - <<'NODE'
          const url = process.env.CHECK_URL;
          const response = await fetch(url, {headers:{'cache-control':'no-cache'}});
          if (!response.ok) throw new Error(`env_check_http_${response.status}`);
          const payload = await response.json();
          console.log(JSON.stringify({
            environment_configured: payload.environment_configured === true,
            origins_configured: payload.origins_configured === true,
          }));
          if (payload.environment_configured !== true || payload.origins_configured !== true) {
            process.exitCode = 3;
          }
          NODE
