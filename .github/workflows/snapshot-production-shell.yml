name: Snapshot production shell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-production-shell.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch accepted v22.5 shell
        run: |
          set -euo pipefail
          url='https://dkefzepiiudehhzbbrjn.supabase.co/storage/v1/object/public/ciao-miniapp/migration/v22-5-resolved-no-x2.html'
          curl --fail --silent --show-error --location "$url" -o cloudflare-production/src/app-shell.html
          grep -q 'ciao-prod-no-x2-20260903' cloudflare-production/src/app-shell.html
          test "$(wc -c < cloudflare-production/src/app-shell.html)" -gt 600000

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-production/src/app-shell.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: track production app shell locally'
          git push origin HEAD:main
