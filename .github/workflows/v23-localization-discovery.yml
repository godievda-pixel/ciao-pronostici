name: v23-localization-discovery

on:
  push:
    branches:
      - v23-test

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    if: github.ref == 'refs/heads/v23-test'
    runs-on: ubuntu-latest
    steps:
      - name: Discover current-season provider team ids
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ciao-v23-localization-discovery")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://lcnwccnkkxaosxnfvjvr.supabase.co/functions/v1/ciao-v23-localization-discovery
