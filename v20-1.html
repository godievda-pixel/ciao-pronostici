<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="ciao-build" content="ciao-web-v20-match-center-20260828"><title>Ciao, Web!</title><style>html,body{margin:0;width:100%;height:100%;background:#0f171f;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}#boot b{font-size:19px}#boot span{display:block;margin-top:8px;color:#96a6b5;font-size:12px}</style></head><body><div id="boot"><div><b>Ciao, Web!</b><span>Загружаем Match Center v20…</span></div></div><script>

  const v20Code="  /* ===== Ciao, Web! v20 Match Center layer ===== */\n  if(!matchTabs.some(([key])=>key==='predictions'))matchTabs.push(['predictions','Прогнозы']);\n\n  function __cw20UserPredictionHtml(d){\n    const match=d?.match||{},pred=match.prediction,finished=!!match.is_finished;\n    if(!pred)return `<div class=\"cw20-pred-summary\"><div class=\"cw20-pred-copy\"><span>Твой прогноз</span><b>Прогноз не сделан</b><span class=\"cw20-pred-meta\">${finished?'Матч завершён':'Его можно сохранить в основном разделе прогнозов'}</span></div><div class=\"cw20-pred-score empty\">—</div></div>`;\n    const pts=pred.points;\n    const meta=pts!=null?`+${Number(pts)||0} ${typeof __cw11Plural==='function'?__cw11Plural(Number(pts)||0,'очко','очка','очков'):'очков'}`:(finished?'ожидает расчёта':'сохранён');\n    return `<div class=\"cw20-pred-summary\"><div class=\"cw20-pred-copy\"><span>Твой прогноз</span><b>${esc(match?.home?.name||'Хозяева')} — ${esc(match?.away?.name||'Гости')}</b><span class=\"cw20-pred-meta\">${esc(meta)}</span></div><div class=\"cw20-pred-score\">${Number(pred.home_score)||0}:${Number(pred.away_score)||0}</div></div>`;\n  }\n  function __cw20PredictionsHtml(d){\n    const split=d?.prediction_split;\n    const distribution=split!=null?__cw9PredictionSplitHtml(d):'<div class=\"cw20-pred-empty\">Распределение прогнозов пока недоступно</div>';\n    return `<section class=\"mc-section\"><div class=\"mc-section-head\"><div class=\"mc-section-title\">Прогнозы</div><div class=\"mc-section-note\">твой прогноз · выбор пользователей</div></div>${__cw20UserPredictionHtml(d)}${distribution}</section>`;\n  }\n\n  const __cw20PrevMatchTabContent=matchTabContent;\n  matchTabContent=function(d,key){if(key==='predictions')return __cw20PredictionsHtml(d);return __cw20PrevMatchTabContent(d,key)};\n\n  const __cw20PrevMatchCenterHtml=matchCenterHtml;\n  matchCenterHtml=function(d){const base=__cw20PrevMatchCenterHtml(d);return base.replace(__cw9PredictionSplitHtml(d),'')};\n\n  const __cw20PrevSectionsForTab=__cw9SectionsForTab;\n  __cw9SectionsForTab=function(key){if(key==='predictions')return [];return __cw20PrevSectionsForTab(key)};\n  const __cw20PrevTabReady=__cw9TabReady;\n  __cw9TabReady=function(key,d){if(key==='predictions')return true;return __cw20PrevTabReady(key,d)};\n\n  const __cw20PrevRefreshMatchCenter=refreshMatchCenter;\n  refreshMatchCenter=async function(){\n    if(matchCenterTab!=='predictions')return __cw20PrevRefreshMatchCenter();\n    if(!matchViewId||matchLoading||document.hidden||String(matchData?.status??'').toLowerCase()==='finished')return;\n    try{\n      const fresh=await __cw9SummaryApi(matchViewId);\n      matchData=__cw9MergeMatch(matchData,fresh);\n      patchMatchCenter(matchData);\n      const current=main.querySelector('[data-mc-tab-content]');\n      if(current&&matchCenterTab==='predictions'){\n        current.dataset.mcTabContent='predictions';\n        current.innerHTML=__cw20PredictionsHtml(matchData);\n      }\n    }catch(_e){}\n  };\n  /* ===== /Ciao, Web! v20 Match Center layer ===== */\n";
  try{
    const r=await fetch(sourceUrl,{cache:'no-store'});if(!r.ok)throw new Error('Не удалось получить стабильную v19.1a: HTTP '+r.status);

    if(!src.includes('ciao-web-v19-1a-20260828'))throw new Error('Неверный pinned baseline v19.1a');

    const declMarker='  const v19Code=';

  }catch(e){console.error('Ciao v20 boot error',e);document.getElementById('boot').innerHTML='<div><b>Не удалось открыть Ciao, Web! v20</b><span>'+String(e?.message||e)+'</span></div>'}
