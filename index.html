<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="ciao-build" content="ciao-web-entry-dynamic">
<meta name="theme-color" content="#091BBD">
<title>Ciao, Web!</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f171f;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#boot b{font-size:19px}#boot span{display:block;margin-top:8px;color:#96a6b5;font-size:12px;line-height:1.45}
#retry{display:none;margin:16px auto 0;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;background:#16233c;color:#fff;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="boot"><div><b>Ciao, Web!</b><span id="status">Открываем приложение…</span><button id="retry" type="button">Повторить</button></div></div>
<script>
(()=>{
  const MANIFEST='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-release-manifest-v1';
  const CACHE_KEY='ciao:production-url';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');

  function safeUrl(raw){
    try{
      const u=new URL(String(raw||''),location.href);
      if(u.protocol!=='https:')return null;
      if(u.hostname!=='godievda-pixel.github.io')return null;
      if(!u.pathname.startsWith('/ciao-pronostici/'))return null;
      return u;
    }catch{return null}
  }

  async function fetchProductionHtml(raw,signal){
    const target=safeUrl(raw);
    if(!target)throw new Error('Некорректный production URL');
    const r=await fetch(target.toString(),{cache:'no-store',signal});
    if(!r.ok)throw new Error('Production HTTP '+r.status);
    const html=await r.text();
    if(!html.includes('meta name="ciao-build"'))throw new Error('Некорректный production HTML');
    return html;
  }

  function mountProduction(html){
    document.open();
    document.write(html);
    document.close();
  }

  async function resolveProduction(){
    retry.style.display='none';
    status.textContent='Открываем приложение…';
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),5000);
    try{
      const r=await fetch(MANIFEST,{cache:'no-store',signal:controller.signal});
      if(!r.ok)throw new Error('Manifest HTTP '+r.status);
      const data=await r.json();
      if(!data?.ok||!safeUrl(data.url))throw new Error('Некорректный manifest');
      const html=await fetchProductionHtml(data.url,controller.signal);
      try{localStorage.setItem(CACHE_KEY,data.url)}catch{}
      mountProduction(html);
      return;
    }catch(e){
      let cached='';
      try{cached=localStorage.getItem(CACHE_KEY)||''}catch{}
      if(safeUrl(cached)){
        try{
          status.textContent='Открываем последнюю доступную версию…';
          const html=await fetchProductionHtml(cached);
          mountProduction(html);
          return;
        }catch{}
      }
      console.error('Ciao dynamic entry error',e);
      status.textContent='Не удалось определить текущую версию. Проверь соединение и повтори.';
      retry.style.display='inline-block';
    }finally{
      clearTimeout(timer);
    }
  }

  retry.addEventListener('click',resolveProduction);
  resolveProduction();
})();
</script>
<noscript>Для запуска Ciao, Web! необходимо включить JavaScript.</noscript>
</body>
</html>
