<style>

<script>
(async()=>{
  const sourceUrl="https://raw.githubusercontent.com/godievda-pixel/ciao-pronostici/effc22598e0b3754c6173fb93b197095d4c2fd41/index.html";
  const upgradeCss="\n/* Ciao, Web! v8 \u2014 agreed UX/API upgrades */\n#ciao-miniapp-root .unsaved{color:#ff5b67!important;font-weight:900!important}\n#ciao-miniapp-root .season-round{margin:0 0 16px}\n#ciao-miniapp-root .season-round-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 3px 7px;padding-top:4px}\n#ciao-miniapp-root .season-round-head b{font-size:14px;color:#f7f9ff}\n#ciao-miniapp-root .season-round-head span{font-size:10px;color:#7f90bc}\n#ciao-miniapp-root .season-calendar-loading{padding:30px 10px;text-align:center;color:#7f90bc}\n#ciao-miniapp-root .serie-head,#ciao-miniapp-root .serie-row{grid-template-columns:46px minmax(0,1fr) 28px 44px 34px!important}\n#ciao-miniapp-root .serie-pos{display:flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;white-space:nowrap!important}\n#ciao-miniapp-root .serie-pos b{font-size:11px;color:#7f90bc}\n#ciao-miniapp-root .serie-pos small{display:inline-grid;place-items:center;min-width:20px;height:17px;padding:0 4px;border-radius:5px;font-size:7px;font-weight:950;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.1)}\n#ciao-miniapp-root .serie-row.europa-zone::before{background:#f3a51f!important}\n#ciao-miniapp-root .serie-row.conference-zone::before{background:#22b875!important}\n#ciao-miniapp-root .serie-pos small.europa{background:#b86d10}\n#ciao-miniapp-root .serie-pos small.conference{background:#168554}\n#ciao-miniapp-root .serie-legend i.europa{background:#f3a51f}\n#ciao-miniapp-root .serie-legend i.conference{background:#22b875}\n#ciao-miniapp-root .mc-predsplit{margin-top:10px!important}\n#ciao-miniapp-root .mc-predsplit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}\n#ciao-miniapp-root .mc-predsplit-item{min-width:0;text-align:center;padding:11px 5px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(132,153,255,.1)}\n#ciao-miniapp-root .mc-predsplit-item b{display:block;font-size:19px;line-height:1;color:#fff}\n#ciao-miniapp-root .mc-predsplit-item span{display:block;margin-top:5px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8796bb;font-weight:900}\n#ciao-miniapp-root .mc-lazy-loading{display:grid;place-items:center;min-height:150px;color:#8796bb;font-size:12px;text-align:center;padding:20px}\n@media(max-width:390px){\n  #ciao-miniapp-root .serie-head,#ciao-miniapp-root .serie-row{grid-template-columns:42px minmax(0,1fr) 25px 38px 30px!important}\n  #ciao-miniapp-root .mc-predsplit-item b{font-size:17px}\n}\n";
  const upgradeCode="\n  /* ===== Ciao, Web! v8 upgrade layer ===== */\n  const __CW8_FAST_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-fast-api';\n  const __CW8_MATCH_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-match-center-fast';\n  let __cw8CalendarData=null,__cw8CalendarLoading=false,__cw8CalendarPromise=null,__cw8CalendarError=null;\n  const __cw8SectionLoading=new Set();\n  let __cw8LiveRefreshing=false;\n\n  async function __cw8Post(url,body,errorText){\n    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify(body)});\n    let j={};try{j=await r.json()}catch(_e){}\n    if(!r.ok||!j.ok){const e=new Error(j.error||errorText||'\u041e\u0448\u0438\u0431\u043a\u0430');e.status=r.status;e.payload=j;throw e}\n    return j;\n  }\n  const __cw8FastApi=body=>__cw8Post(__CW8_FAST_API,body,'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u043e\u0431\u043d\u043e\u0432\u0438\u0442\u044c \u043c\u0430\u0442\u0447\u0438');\n  const __cw8FastMatchApi=(id,sections=[])=>__cw8Post(__CW8_MATCH_API,{match_id:Number(id),sections},'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u041c\u0430\u0442\u0447-\u0446\u0435\u043d\u0442\u0440');\n\n  function isPredictionDirty(m){\n    const d=draft.get(Number(m?.id));\n    if(!d)return false;\n    const p=m?.prediction;\n    if(!p)return true;\n    return Number(d.h)!==Number(p.home_score)||Number(d.a)!==Number(p.away_score);\n  }\n  function predictionStatusHtml(m){\n    return (isPredictionDirty(m)||!m?.prediction)?'<span class=\"unsaved\">\u043d\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d</span>':'<span class=\"saved\">\u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d</span>';\n  }\n\n  table=function(){\n    return `<div class=\"section-title\"><h3>\u041e\u0431\u0449\u0430\u044f \u0442\u0430\u0431\u043b\u0438\u0446\u0430</h3><span>${S.standings.length} \u0438\u0433\u0440\u043e\u043a\u043e\u0432</span></div><div class=\"card\">`+\n      S.standings.map((x,i)=>`<div class=\"list-row ${x.id===S.user.id?'me':''}\"><div class=\"pos\">${i===0?'\ud83e\udd47':i===1?'\ud83e\udd48':i===2?'\ud83e\udd49':i+1}</div><div class=\"person\">${esc(x.display_name)}</div><div class=\"pts\">${x.points}</div></div>`).join('')+`</div>`;\n  };\n\n  serieA=function(){\n    const t=S?.serie_a_table,rows=Array.isArray(t?.rows)?t.rows:[];\n    if(!rows.length)return hero()+`<div class=\"section-title\"><h3>\u0421\u0435\u0440\u0438\u044f \u0410</h3><span>2026/27</span></div><div class=\"empty\">\u0422\u0443\u0440\u043d\u0438\u0440\u043d\u0430\u044f \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u043f\u043e\u043a\u0430 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0430</div>`;\n    const updated=t?.updated_at?`\u041e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u043e ${new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(t.updated_at))}`:'2026/27';\n    return hero()+`<div class=\"section-title\"><h3>\u0421\u0435\u0440\u0438\u044f \u0410</h3><span>${esc(updated)}</span></div><div class=\"card serie-card\"><div class=\"serie-head\"><span>#</span><span>\u041a\u043e\u043c\u0430\u043d\u0434\u0430</span><span>\u0418</span><span>\u0420\u041c</span><span>\u041e</span></div>`+\n      rows.map(r=>{\n        const pos=Number(r.position)||0,gd=Number(r.goal_difference)||0;\n        const top=pos>0&&pos<=4,europa=pos===5,conference=pos===6,bottom=pos>=18;\n        const cls=top?'top-zone':europa?'europa-zone':conference?'conference-zone':bottom?'drop-zone':'';\n        const badge=europa?'<small class=\"europa\">\u041b\u0415</small>':conference?'<small class=\"conference\">\u041b\u041a</small>':'';\n        return `<div class=\"serie-row ${cls}\"><span class=\"serie-pos\"><b>${pos||'\u2014'}</b>${badge}</span><span class=\"serie-team\">${r.custom_emoji_id?`<img class=\"serie-logo\" loading=\"lazy\" decoding=\"async\" src=\"${API_BASE}?asset=emoji&id=${encodeURIComponent(r.custom_emoji_id)}\" alt=\"\">`:'<span class=\"serie-ball\">\u26bd</span>'}<b>${esc(r.team_name||'\u041a\u043e\u043c\u0430\u043d\u0434\u0430')}</b></span><span>${Number(r.played)||0}</span><span>${gd>0?'+':''}${gd}</span><strong>${Number(r.points)||0}</strong></div>`;\n      }).join('')+`</div><div class=\"serie-legend\"><span><i class=\"top\"></i>\u041b\u0438\u0433\u0430 \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u043e\u0432</span><span><i class=\"europa\"></i>\u041b\u0438\u0433\u0430 \u0415\u0432\u0440\u043e\u043f\u044b (\u041b\u0415)</span><span><i class=\"conference\"></i>\u041b\u0438\u0433\u0430 \u043a\u043e\u043d\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u0439 (\u041b\u041a)</span><span><i class=\"drop\"></i>\u0417\u043e\u043d\u0430 \u0432\u044b\u043b\u0435\u0442\u0430</span></div>`;\n  };\n\n  async function __cw8LoadCalendar(){\n    if(__cw8CalendarData)return __cw8CalendarData;\n    if(__cw8CalendarPromise)return __cw8CalendarPromise;\n    __cw8CalendarLoading=true;__cw8CalendarError=null;\n    __cw8CalendarPromise=__cw8FastApi({action:'calendar_all'}).then(r=>{\n      __cw8CalendarData=Array.isArray(r.matches)?r.matches:[];\n      return __cw8CalendarData;\n    }).catch(e=>{__cw8CalendarError=e;throw e}).finally(()=>{__cw8CalendarLoading=false;__cw8CalendarPromise=null});\n    return __cw8CalendarPromise;\n  }\n  function __cw8CalendarCard(x){\n    return `<div class=\"scoreboard-card ${boardState(x)}\" data-mid=\"${x.id}\"><div class=\"scoreboard-top\"><span class=\"board-status\" data-live-slot=\"board-status\">${boardStatus(x)}</span><span class=\"board-kickoff\">${fmt(x.kickoff_at)}</span></div><div class=\"scoreboard-main\"><div class=\"board-team\">${logo(x.home)}<div class=\"board-team-name\">${esc(x.home?.name||'\u2014')}</div></div><div class=\"board-center\"><div class=\"board-score ${boardState(x)==='upcoming'?'waiting':''}\" data-live-slot=\"board-score\">${boardScore(x)}</div><div class=\"board-caption\" data-live-slot=\"board-caption\">${boardCaption(x)}</div></div><div class=\"board-team\">${logo(x.away)}<div class=\"board-team-name\">${esc(x.away?.name||'\u2014')}</div></div></div></div>`;\n  }\n  calendar=function(){\n    if(!__cw8CalendarData&&!__cw8CalendarLoading&&!__cw8CalendarError){\n      Promise.resolve().then(__cw8LoadCalendar).then(()=>{if(tab==='calendar'&&!matchViewId)render()}).catch(e=>{if(e?.payload?.subscription_required)renderSubscriptionGate(e.payload);else if(tab==='calendar'&&!matchViewId)render()});\n    }\n    if(__cw8CalendarError)return `<div class=\"section-title\"><h3>\u041c\u0430\u0442\u0447\u0438 \u00b7 \u0432\u0435\u0441\u044c \u0441\u0435\u0437\u043e\u043d</h3><span>2026/27</span></div><div class=\"empty\"><b>\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u044c</b><br><br>${esc(__cw8CalendarError.message||'\u041e\u0448\u0438\u0431\u043a\u0430')}</div>`;\n    if(!__cw8CalendarData)return `<div class=\"section-title\"><h3>\u041c\u0430\u0442\u0447\u0438 \u00b7 \u0432\u0435\u0441\u044c \u0441\u0435\u0437\u043e\u043d</h3><span>2026/27</span></div><div class=\"season-calendar-loading\">\u0417\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u043c \u043f\u043e\u043b\u043d\u044b\u0439 \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u044c\u2026</div>`;\n    const groups=new Map();\n    for(const m of __cw8CalendarData){const n=Number(m?.round?.number)||0;if(!groups.has(n))groups.set(n,[]);groups.get(n).push(m)}\n    const nums=[...groups.keys()].sort((a,b)=>a-b);\n    return `<div class=\"section-title\"><h3>\u041c\u0430\u0442\u0447\u0438 \u00b7 \u0432\u0435\u0441\u044c \u0441\u0435\u0437\u043e\u043d</h3><span>${nums.length} \u0442\u0443\u0440\u043e\u0432</span></div>`+nums.map(n=>{\n      const games=groups.get(n).slice().sort((a,b)=>new Date(a.kickoff_at||'2999').getTime()-new Date(b.kickoff_at||'2999').getTime());\n      return `<section class=\"season-round\" id=\"season-round-${n}\"><div class=\"season-round-head\"><b>${n?n+'-\u0439 \u0442\u0443\u0440':'\u0411\u0435\u0437 \u0442\u0443\u0440\u0430'}</b><span>${games.length} \u043c\u0430\u0442\u0447\u0435\u0439</span></div><div class=\"scoreboards\">${games.map(__cw8CalendarCard).join('')}</div></section>`;\n    }).join('');\n  };\n\n  function __cw8PredictionSplitHtml(d){\n    const s=d?.prediction_split||{},total=Number(s.total)||0;\n    const h=Number(s?.home?.pct)||0,x=Number(s?.draw?.pct)||0,a=Number(s?.away?.pct)||0;\n    return `<section class=\"mc-section mc-predsplit\" data-mc-predsplit><div class=\"mc-section-head\"><div class=\"mc-section-title\">\u041f\u0440\u043e\u0433\u043d\u043e\u0437\u044b \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u0435\u0439</div><div class=\"mc-section-note\">${total?total+' \u043f\u0440\u043e\u0433\u043d\u043e\u0437\u043e\u0432':'\u043f\u043e\u043a\u0430 \u043d\u0435\u0442 \u043f\u0440\u043e\u0433\u043d\u043e\u0437\u043e\u0432'}</div></div><div class=\"mc-predsplit-grid\"><div class=\"mc-predsplit-item\"><b>${h}%</b><span>\u041f1</span></div><div class=\"mc-predsplit-item\"><b>${x}%</b><span>\u041d\u0438\u0447\u044c\u044f</span></div><div class=\"mc-predsplit-item\"><b>${a}%</b><span>\u041f2</span></div></div></section>`;\n  }\n  function __cw8MergeMatch(base,next){\n    if(!base)return next;\n    const out={...base,...next,match:next?.match||base?.match,prediction_split:next?.prediction_split||base?.prediction_split,coverage:{...(base?.coverage||{}),...(next?.coverage||{})},errors:{...(base?.errors||{}),...(next?.errors||{})}};\n    for(const k of ['detail','stats','incidents','lineups','player_stats']){\n      if(next&&next[k]!=null)out[k]=next[k];else if(base&&base[k]!=null)out[k]=base[k];\n    }\n    return out;\n  }\n  function __cw8ReplaceSplit(d){\n    const cur=main.querySelector('[data-mc-predsplit]');if(!cur)return;\n    const box=document.createEl
