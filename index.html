<script>
(function(){
  function postEvent(eventType,eventData){
    if(eventData===undefined) eventData='';
    try{
      if(window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent==='function'){
        window.TelegramWebviewProxy.postEvent(eventType,JSON.stringify(eventData));
        return true;
      }
    }catch(e){}
    try{
      if(window.external && typeof window.external.notify==='function'){
        window.external.notify(JSON.stringify({eventType:eventType,eventData:eventData}));
        return true;
      }
    }catch(e){}
    try{
      if(window.parent && window.parent!==window){
        window.parent.postMessage(JSON.stringify({eventType:eventType,eventData:eventData}),'*');
        return true;
      }
    }catch(e){}
    return false;
  }

  function params(){
    var out={};
    try{
      [location.hash.replace(/^#/,''),location.search.replace(/^\?/, '')].forEach(function(raw){
        var p=new URLSearchParams(raw);
        p.forEach(function(v,k){ if(out[k]===undefined) out[k]=v; });
      });
    }catch(e){}
    return out;
  }
  var p=params();
  window.Telegram=window.Telegram||{};
  var existing=window.Telegram.WebApp||{};
  var shim={
    initData: existing.initData || p.tgWebAppData || '',
    version: existing.version || p.tgWebAppVersion || '',
    platform: existing.platform || p.tgWebAppPlatform || '',
    ready:function(){ postEvent('web_app_ready'); },
    expand:function(){ postEvent('web_app_expand'); },
    disableVerticalSwipes:function(){ postEvent('web_app_setup_swipe_behavior',{allow_vertical_swipe:false}); },
    setHeaderColor:function(){},
    setBackgroundColor:function(){},
    onEvent:function(){},
    HapticFeedback:{notificationOccurred:function(){}},
    showAlert:function(msg){ try{alert(msg);}catch(e){} },
    get viewportHeight(){ return window.innerHeight; },
    get viewportStableHeight(){ return window.innerHeight; }
  };
  window.Telegram.WebApp=Object.assign(shim,existing);
  window.__ciaoNativePost=postEvent;

  // Official SDK semantics: web_app_ready has an empty-string payload.
  postEvent('web_app_ready');
  postEvent('web_app_expand');
  try{ window.Telegram.WebApp.disableVerticalSwipes(); }catch(e){}
})();
</script>

      i.src=DIAG+'?stage='+encodeURIComponent(stage)+'&v=7&t='+Date.now();
      document.body.appendChild(i);
    }catch(e){}
  }
  diag('dom-detached');

  // Важно: ready вызываем ещё раз ПОСЛЕ переноса root в body.
  try { window.__ciaoNativePost?.('web_app_ready'); window.__ciaoNativePost?.('web_app_expand'); } catch(e) {}
  try { tg?.ready?.(); tg?.expand?.(); tg?.disableVerticalSwipes?.(); } catch(e) {}
  applyViewport();
  try { tg?.onEvent?.('viewportChanged', applyViewport); } catch(e) {}
  window.addEventListener('resize',applyViewport,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(applyViewport,120),{passive:true});
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden';
  try { tg?.setHeaderColor?.('secondary_bg_color'); tg?.setBackgroundColor?.('bg_color'); } catch(e) {}
  function initDataFromUrl(){
    try {
      const variants=[location.search.replace(/^\?/,''),location.hash.replace(/^#/, '')];
      for(const raw of variants){
        const p=new URLSearchParams(raw);
        const x=p.get('tgWebAppData');
        if(x) return x;
      }
    } catch(e) {}
    return '';
  }
  async function waitInitData(){
    for(let i=0;i<30;i++){
      const x=window.Telegram?.WebApp?.initData || initDataFromUrl();
      if(x) return x;
      await new Promise(r=>setTimeout(r,100));
    }
    return '';
  }
  let initData = '';
  const toastEl = root.querySelector('#ciao-toast');
  let S = null, tab = 'predict', selectedRound = null, draft = new Map();
  const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = iso => iso ? new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',',' ·') : 'время уточняется';
  const API_BASE = 'https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-miniapp-api'; // backend для page210244509
  const api = async (body) => { const r=await fetch(API_BASE,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok||!j.ok) throw new Error(j.error||'Ошибка'); return j; };
  const logo = t => t?.custom_emoji_id ? `<img class="logo" loading="lazy" decoding="async" fetchpriority="low" src="${API_BASE}?asset=emoji&id=${encodeURIComponent(t.custom_emoji_id)}" alt="">` : '<span class="logo">⚽</span>';
  function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800);try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
  function roundBar(){return `<div class="rounds">${S.rounds.map(r=>`<button class="round-chip ${r.number===S.selected_round?'active':''} ${r.unlocked?'':'locked'}" data-round="${r.number}" ${r.unlocked?'':'disabled'}>${r.unlocked?r.number:'🔒 '+r.number}</button>`).join('')}</div>`}
  function hero(){return `<div class="hero"><div class="hero-top"><div><h2>${esc(S.user.display_name)}</h2><p>${S.user.username?'@'+esc(S.user.username):'Игрок Ciao, Pronostici!'}</p></div><div><div class="rank">#${S.stats.rank}</div><p>место</p></div></div></div>`}
  function scoreOf(m){const d=draft.get(m.id); if(d) return d; const p=m.prediction; return {h:p?.home_score??0,a:p?.away_score??0};}
  const isLive=m=>String(m?.live_status??'').toLowerCase()==='live';
  const liveTag=m=>`<span class="live-pill"><i class="live-dot"></i>LIVE${m?.live_elapsed!=null?` · ${Number(m.live_elapsed)}′`:''}</span>`;
  const liveScore=m=>(m?.home_score!=null&&m?.away_score!=null)?`${m.home_score}:${m.away_score}`:'—';
  function predict(){
    const m=S.round.matches;
    return hero()+roundBar()+`<div class="section-title"><h3>${S.selected_round}-й тур</h3><span>дедлайн −1 час</span></div><div class="matches">`+m.map(x=>{const v=scoreOf(x);const live=isLive(x);return `<div class="match ${x.open?'':'closed'}" data-mid="${x.id}"><div class="match-head"><div class="teams"><div class="team">${logo(x.home)}<span class="team-name">${esc(x.home.name)}</span></div><span class="dash">—</span><div class="team away"><span class="team-name">${esc(x.away.name)}</span>${logo(x.away)}</div></div></div>${live?`<div class="live-row">${liveTag(x)}<span class="live-score">${liveScore(x)}</span></div>`:''}${x.open?`<div class="score"><div class="score-side"><button data-delta="h:-1">−</button><div class="score-value">${v.h}</div><button data-delta="h:1">+</button></div><span class="colon">:</span><div class="score-side"><button data-delta="a:-1">−</button><div class="score-value">${v.a}</div><button data-delta="a:1">+</button></div></div>`:''}<div class="meta"><span>Начало матча: ${fmt(x.kickoff_at)}</span><span>${x.is_finished?`Итог ${x.home_score}:${x.away_score}`:live?'матч идёт':x.open?(x.prediction?'<span class="saved">сохранён</span>':'не сохранён'):'🔒 закрыт'}</span></div></div>`}).join('')+`</div><div class="savebar"><button id="saveAll" class="save">Сохранить прогнозы на тур</button></div>`;
  }
  function mine(){return hero()+roundBar()+`<div class="section-title"><h3>Мои прогнозы · ${S.selected_round}-й тур</h3></div><div class="card">`+S.round.matches.map(x=>{const p=x.prediction,live=isLive(x);return `<div class="list-row"><div style="display:flex;align-items:center;gap:7px;min-width:0">${logo(x.home)}<div><div style="font-weight:800">${esc(x.home.name)} — ${esc(x.away.name)}</div><div style="font-size:12px;color:var(--muted)">${fmt(x.kickoff_at)}${live?` · <span style="color:#ff7285;font-weight:800">LIVE${x.live_elapsed!=null?` ${x.live_elapsed}′`:''} ${liveScore(x)}</span>`:''}</div></div></div><div class="pts">${p?`${p.home_score}:${p.away_score}${p.points!=null?` · +${p.points}`:''}`:'—'}</div></div>`}).join('')+`</div>`}
  function table(){return hero()+`<div class="section-title"><h3>Общая таблица</h3><span>${S.standings.length} игроков</span></div><div class="card">`+S.standings.map((x,i)=>`<div class="list-row ${x.id===S.user.id?'me':''}"><div class="pos">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="person">${esc(x.display_name)}</div><div class="pts">${x.points}</div></div>`).join('')+`</div>`}
  function calendar(){return roundBar()+`<div class="section-title"><h3>Календарь · ${S.selected_round}-й тур</h3></div><div class="card">`+S.round.matches.map(x=>{const live=isLive(x);return `<div class="calendar-row"><div class="cal-time">Начало матча: ${fmt(x.kickoff_at)} ${live?` · <span style="color:#ff7285;font-weight:900">LIVE${x.live_elapsed!=null?` ${x.live_elapsed}′`:''}</span>`:''}</div><div class="cal-match">${logo(x.home)} ${esc(x.home.name)} — ${esc(x.away.name)} ${logo(x.away)} ${(x.is_finished||live)?`<span class="result">${x.home_score??'—'}:${x.away_score??'—'}</span>`:''}</div></div>`}).join('')+`</div>`}
  function profile(){return hero()+`<div class="stats-grid"><div class="stat"><b>${S.stats.points}</b><span>Очки</span></div><div class="stat"><b>${S.stats.exact}</b><span>Точных счетов</span></div><div class="stat"><b>${S.stats.successful}</b><span>Удачных прогнозов</span></div><div class="stat"><b>${S.stats.calculated}</b><span>Рассчитано матчей</span></div></div><div class="card" style="margin-top:10px"><div class="settings-row"><div><b>Напоминания о дедлайнах</b><div style="font-size:12px;color:var(--muted);margin-top:3px">За 3 часа и за 30 минут</div></div><button id="remSwitch" class="switch ${S.user.reminders?'on':''}"><i></i></button></div></div>`}
  let firstRenderDone=false;
  function render(){
    applyViewport();
    root.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    main.innerHTML=tab==='predict'?predict():tab==='mine'?mine():tab==='table'?table():tab==='calendar'?calendar():profile();
    bind();
    if(!firstRenderDone){
      firstRenderDone=true;
      requestAnimationFrame(()=>{
        try{ window.__ciaoNativePost?.('web_app_ready'); }catch(e){}
        diag('render-done');
      });
    }
  }
  function bind(){
    root.querySelectorAll('[data-round]').forEach(b=>b.onclick=async()=>{const n=Number(b.dataset.round); if(n===S.selected_round)return; await load(n)});
    root.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{const box=b.closest('.match'),id=Number(box.dataset.mid),m=S.round.matches.find(x=>x.id===id);if(!m?.open)return;const cur=scoreOf(m),[side,ds]=b.dataset.delta.split(':'),d=Number(ds),nv={h:cur.h,a:cur.a};nv[side]=Math.max(0,Math.min(20,nv[side]+d));draft.set(id,nv);render();});
    const save=root.querySelector('#saveAll'); if(save) save.onclick=saveAll;
    const sw=root.querySelector('#remSwitch'); if(sw) sw.onclick=toggleRem;
  }
  async function saveAll(){const items=S.round.matches.filter(x=>x.open).map(x=>{const v=scoreOf(x);return{match_id:x.id,home_score:v.h,away_score:v.a}}); if(!items.length)return toast('Нет открытых матчей'); try{const r=await api({action:'save_predictions',round:S.selected_round,predictions:items});toast(`Сохранено: ${r.saved}`);await load(S.selected_round,true);}catch(e){(tg.showAlert?tg.showAlert(e.message):alert(e.message))}}
  async function toggleRem(){try{const enabled=!S.user.reminders;await api({action:'toggle_reminders',enabled});S.user.reminders=enabled;render();toast(enabled?'Напоминания включены':'Напоминания отключены')}catch(e){(tg.showAlert?tg.showAlert(e.message):alert(e.message))}}
  async function load(round,quiet=false){
    if(!quiet)main.innerHTML='<div class="loader"><div><div class="spinner"></div>Загрузка…</div></div>';
    try{
      S=await api({action:'state',round});
      diag('api-done');
      selectedRound=S.selected_round;
      draft.clear();
      render();
    }catch(e){
      diag('api-error');
      main.innerHTML=`<div class="empty"><b>Не удалось открыть приложение</b><br><br>${esc(e.message)}<br><br>Закрой Mini App и открой заново из бота.</div>`;
    }
  }
  async function refreshLive(){
    if(!S||document.hidden)return;
    try{
      const next=await api({action:'state',round:S.selected_round});
      S=next;selectedRound=S.selected_round;render();
    }catch(e){}
  }
  setInterval(refreshLive,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLive()});
  root.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  (async()=>{
    initData=await waitInitData();
    if(!initData){
      main.innerHTML='<div class="empty"><b>Telegram не передал данные авторизации.</b><br><br>Закрой Mini App и открой его заново из бота.</div>';
      return;
    }
    await load();
  })();
})();
</script>

</body>
</html>
