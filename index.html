  const upgradeCode="\n  /* ===== Ciao, Web! v10 upgrade layer ===== */\n  const __CW9_FAST_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-fast-api-v2';\n  const __CW9_MATCH_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-match-center-fast-v3';\n  const __CW9_SUMMARY_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-match-summary-fast-v2';\n  const __cw9SectionLoading=new Set();\n  let __cw9LiveRefreshing=false,__cw9OverviewWarm=null,__cw9LastSectionRefresh=0;\n\n  async function __cw9Post(url,body,errorText){\n    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify(body)});\n    let j={};try{j=await r.json()}catch(_e){}\n    if(!r.ok||!j.ok){const e=new Error(j.error||errorText||'\u041e\u0448\u0438\u0431\u043a\u0430');e.status=r.status;e.payload=j;throw e}\n    return j;\n  }\n  const __cw9FastApi=body=>__cw9Post(__CW9_FAST_API,body,'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u043e\u0431\u043d\u043e\u0432\u0438\u0442\u044c \u043c\u0430\u0442\u0447\u0438');\n  const __cw9FastMatchApi=(id,sections=[])=>__cw9Post(__CW9_MATCH_API,{match_id:Number(id),sections,include_split:false},'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u041c\u0430\u0442\u0447-\u0446\u0435\u043d\u0442\u0440');\n  const __cw9SummaryApi=id=>__cw9Post(__CW9_SUMMARY_API,{match_id:Number(id)},'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043c\u0430\u0442\u0447');\n\n  function isPredictionDirty(m){\n    const d=draft.get(Number(m?.id));\n    if(!d)return false;\n    const p=m?.prediction;\n    if(!p)return true;\n    return Number(d.h)!==Number(p.home_score)||Number(d.a)!==Number(p.away_score);\n  }\n  function predictionStatusHtml(m){\n    return (isPredictionDirty(m)||!m?.prediction)?'<span class=\"unsaved\">\u043d\u0435 \u044 pos\">${pos||'\u2014'}</span><span class=\"serie-team\">${r.custom_emoji_id?`<img class=\"serie-logo\" loading=\"lazy\" decoding=\"async\" src=\"${API_BASE}?asset=emoji&id=${encodeURIComponent(r.custom_emoji_id)}\" alt=\"\">`:'<span class=\"serie-ball\">\u26bd</span>'}<b>${esc(r.team_name||'\u041a\u043e\u043c\u0430\u043d\u0434\u0430')}</b></span><span>${Number(r.played)||0}</span><span>${gd>0?'+':''}${gd}</span><strong>${Number(r.points)||0}</strong></div>`;\n      }).join('')+`</div><div class=\"serie-legend\"><span><i class=\"top\"></i>\u041b\u0438\u0433\u0430 \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u043e\u0432</span><span><i class=\"europa\"></i>\u041b\u0438\u0433\u0430 \u0415\u0432\u0440\u043e\u043f\u044b</span><span><i class=\"conference\"></i>\u041b\u0438\u0433\u0430 \u043a\u043e\u043d\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u0439</span><span><i class=\"drop\"></i>\u0417\u043e\u043d\u0430 \u0432\u044b\u043b\u0435\u0442\u0430</span></div>`;\n  };\n\n  function __cw9CalendarCard(x){\n    return `<div class=\"scoreboard-card ${boardState(x)}\" data-mid=\"${x.id}\"><div class=\"scoreboard-top\"><span class=\"board-status\" data-live-slot=\"board-status\">${boardStatus(x)}</span><span class=\"board-kickoff\">${fmt(x.kickoff_at)}</span></div><div class=\"scoreboard-main\"><div class=\"board-team\">${logo(x.home)}<div class=\"board-team-name\">${esc(x.home?.name||'\u2014')}</div></div><div class=\"board-center\"><div class=\"board-score ${boardState(x)==='upcoming'?'waiting':''}\" data-live-slot=\"board-score\">${boardScore(x)}</div><div class=\"board-caption\" data-live-slot=\"board-caption\">${boardCaption(x)}</div></div><div class=\"board-team\">${logo(x.away)}<div class=\"board-team-name\">${esc(x.away?.name||'\u2014')}</div></div></div></div>`;\n  }\n  calendar=function(){\n    const games=Array.isArray(S?.round?.matches)?S.round.matches:[];\n    return roundBar()+`<div class=\"section-title\"><h3>\u041c\u0430\u0442\u0447\u0438 \u00b7 ${Number(S?.selected_r
